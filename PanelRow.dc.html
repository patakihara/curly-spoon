<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="font-family:{{ ff }};font-size:{{ fs }}px;letter-spacing:{{ ls }};text-transform:{{ tt }};opacity:{{ op }};color:inherit">{{ text }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:240,&quot;height&quot;:40},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Sort by&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component panelRow (a heading line in a back-layer panel).
// Props: text, visuals (resolved by the shell: Layout.resolveVisuals(specs, 'panelRow', state, ctx)). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const v = this.props.visuals || {};
    return { text: this.props.text || '', ff: v.fontFamily || 'inherit', fs: +v.fontSize || 12, ls: v.letterSpacing || 'normal', tt: v.textTransform || 'none', op: v.opacity ?? 1 };
  }
}
</script>
</body>
</html>
