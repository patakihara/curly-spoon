<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;padding:0 {{ padX }}px"><div onClick="{{ onOpen }}" role="{{ role }}" aria-label="{{ hint }}" style="position:relative;height:{{ ch }}px;width:{{ cw }}px;box-sizing:border-box;display:flex;align-items:center;overflow:hidden;border-radius:{{ cr }};background:{{ bg }};cursor:{{ cur }};transition:width {{ ms }}ms {{ ease }}, height {{ ms }}ms {{ ease }}, border-radius {{ ms }}ms {{ ease }}, background-color {{ ms }}ms {{ ease }}"><span style="font-family:'Material Symbols Rounded';font-feature-settings:'liga';line-height:1;flex:none;width:{{ iw }}px;text-align:center;font-size:{{ is }}px;opacity:{{ io }};transition:width {{ ms }}ms {{ ease }}, font-size {{ ms }}ms {{ ease }}">search</span><input data-light="{{ light }}" value="{{ value }}" onChange="{{ onInput }}" placeholder="{{ hint }}" tabIndex="{{ tab }}" style="flex:1;min-width:0;border:0;outline:none;background:transparent;font:inherit;font-size:{{ fs }}px;color:inherit;opacity:{{ fo }};transition:opacity {{ fms }}ms {{ ease }} {{ fdelay }}ms"></input><sc-if value="{{ hasEnd }}" hint-placeholder-val="{{ false }}"><div onClick="{{ stop }}" style="flex:none;display:flex;align-items:center;margin-inline-start:{{ endGap }}px"><dc-import name="IconButton" dc-props="{{ endIx }}" icon="{{ endIcon }}" hint-size="28px,28px"></dc-import></div></sc-if></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:48},&quot;open&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;hint&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Search albums&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;},&quot;motion&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component morph (sample: local search — from: the search icon, to: the field).
// Props: open, value, hint, onOpen, onInput, light, width (the bar span when open), closedSize (the from-button's size),
// visuals (localSearch, resolved), motion (morph · morphed, resolved). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.visuals || {}, m = p.motion || {}, open = !!p.open, bs = +p.closedSize || 40;
    const ms = m.kind === 'instant' ? 0 : +m.ms || 0, split = m.fadeSplit ?? 0.35;
    return { hasEnd: open && !!p.hasEnd, endIx: p.endIx || {}, endIcon: p.endIcon || '', endGap: +v.endGap || 0, stop: e => e.stopPropagation(), open, value: p.value || '', hint: p.hint || '', onOpen: p.onOpen || (() => {}), onInput: p.onInput || (() => {}), light: p.light, padX: +v.padX || 0,
      role: open ? 'search' : 'button', cur: open ? 'text' : 'pointer', tab: open ? 0 : -1, ms, ease: m.easing || 'ease',
      ch: open ? Math.min(+v.height || 32, bs) : bs, cw: open ? +p.width || 168 : bs, cr: open ? (+v.radius || 6) + 'px' : bs / 2 + 'px',
      bg: open ? v.fill || 'transparent' : v.fillClosed || 'transparent', iw: open ? +v.iconBoxOpen || 30 : bs,
      is: open ? +v.iconSizeOpen || 18 : (bs < 40 ? +v.iconSizeClosedSmall || 20 : +v.iconSizeClosed || 22), io: open ? v.iconOpacityOpen ?? .7 : 1,
      fs: +v.fontSize || 13, fo: open ? 1 : 0, fms: Math.round(ms * (1 - split)), fdelay: open ? Math.round(ms * split) : 0 };
  }
}
</script>
</body>
</html>
