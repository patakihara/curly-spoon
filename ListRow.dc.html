<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet><script src="./interactive.js"></script><link rel="stylesheet" href="./design/assets/fonts/fonts.css"><style>.ms{font-family:'Material Symbols Rounded';font-size:24px;line-height:1;font-feature-settings:'liga'}</style></helmet>
<div ref="{{ rootRef }}" onClick="{{ onClick }}" onKeyDown="{{ onKeyDown }}" onPointerEnter="{{ onPointerEnter }}" onPointerLeave="{{ onPointerLeave }}" onPointerDown="{{ onPointerDown }}" onFocus="{{ onFocus }}" onBlur="{{ onBlur }}" tabIndex="{{ tab }}" aria-label="{{ label }}" aria-busy="{{ busy }}" data-status="{{ status }}" role="button" aria-disabled="{{ disabled }}" data-item-id="{{ itemId }}" style="position:relative;overflow:hidden;display:flex;align-items:center;gap:16px;padding:{{ padY }}px 16px;border-bottom:{{ divider }};background-color:transparent;color:{{ ink }};border-radius:{{ radius }};box-shadow:{{ layerShadow }};transition:{{ ixTrans }};transform:scale({{ pressScale }});outline:{{ outline }};outline-offset:-2px;cursor:{{ cur }};opacity:{{ op }}">
  <div data-shared="image" style="width:{{ thumb }}px;height:{{ thumb }}px;border-radius:{{ vis.thumbRadius }}px;background:{{ art }};flex:none"></div>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column;gap:6px">
    <div style="font-size:14px">{{ text }}</div>
    <div style="display:flex;align-items:center;gap:6px;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px;font-family:ui-monospace,Menlo,monospace;color:#888"><sc-if value="{{ hasSubIcon }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:14px;flex:none">{{ subIcon }}</span></sc-if>{{ sub }}</div>
  </div>
  <sc-if value="{{ hasTrailing }}" hint-placeholder-val="{{ false }}"><span class="ms" style="font-size:20px;color:#999">{{ trailing }}</span></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:90}}">
// Web implementation of a design-system component (§20 interactive): state, state layer, ripples, focus ring and the base
// state-transition motions come from the shared helper interactive.js (design/components/interactive). Each placed instance owns its
// hover / press / focus and its ripples; it is identified by props.id (its slot path). When the slot path
// changes (the instance is reused for another place), all of that is dropped.
// Props from the shell: id, label, resolve(input) → InteractionView (core), look(state) → visuals (design),
// activate(event), dim, motion (press: ripple descriptor), motions (per visual: stateLayer, rotation…; design §15); plus the component's own content props.
class Component extends DCLogic {
  state = { input: {} };
  rootRef = React.createRef(); iconRef = React.createRef();
  componentDidMount() { if (!window.DCInteractive) { this._ready = () => this.forceUpdate(); window.addEventListener('dc-interactive-ready', this._ready); } }
  componentDidUpdate(prev) { if (window.DCInteractive) window.DCInteractive.update(this, prev); }
  componentWillUnmount() { if (this._ready) window.removeEventListener('dc-interactive-ready', this._ready); if (window.DCInteractive) window.DCInteractive.drop(this); }
  // shared helper (interactive.js); inert until it has loaded
  base() { const I = window.DCInteractive; if (I) return I.base(this); const no = () => {}; return { vis: {}, rootRef: this.rootRef, status: '', busy: false, disabled: true, tab: -1, label: this.props.label || '', layerShadow: 'none', ixTrans: 'none', pressScale: 1, outline: 'none', radius: '0px', op: 1, cur: 'default', onClick: no, onKeyDown: no, onPointerEnter: no, onPointerLeave: no, onPointerDown: no, onFocus: no, onBlur: no }; }
  renderVals() { const p = this.props; const b = this.base(); return { ...b, padY: p.padY != null ? +p.padY : 12, divider: p.divider === 'none' ? '0' : '1px solid #efeeea', ink: b.vis.color || 'inherit', itemId: p.itemId, text: p.text || '', sub: p.sub || '', subIcon: p.subIcon || '', hasSubIcon: !!p.subIcon, trailing: p.trailing || '', hasTrailing: !!p.trailing, thumb: p.thumb || 52, art: p.art || '#ecebe7' }; }
}
</script>
</body>
</html>
