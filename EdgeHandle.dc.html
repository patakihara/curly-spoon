<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onMouseEnter="{{ onEnter }}" style="width:{{ v.handleWidth }}px;height:{{ v.handleHeight }}px;border-radius:{{ v.handleRadius }};background:{{ v.handleFill }};color:{{ v.handleInk }};display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:{{ v.handleShadow }}"><dc-import name="Symbol" icon="{{ v.handleIcon }}" visuals="{{ iconVis }}" hint-size="18px,18px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:40,&quot;height&quot;:90},&quot;onEnter&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web drawing of the side sheet's edge handle (design: sideSheet handle* visuals) shown in auto mode; hovering it opens the sheet. Props: onEnter, visuals. No values of its own.
class Component extends DCLogic {
  renderVals() { const v = this.props.visuals || {}; return { v, onEnter: this.props.onEnter || (() => {}), iconVis: { ...(this.props.symbolVisuals || {}), size: +v.handleIconSize || 18, padEnd: 0 } }; }
}
</script>
</body>
</html>
