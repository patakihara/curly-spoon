<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;inset:0;pointer-events:none">
  <div data-piece="scrim" onClick="{{ onScrim }}" style="position:absolute;inset:0;background:{{ v.scrim }};opacity:{{ op }};pointer-events:{{ ev }};cursor:{{ cur }};transition:{{ scrimTr }}"></div>
  <div style="position:absolute;top:0;bottom:0;inset-inline-start:0;width:{{ v.width }}px;max-width:{{ v.maxWidth }};transform:translateX({{ tx }}%);transition:{{ surfaceTr }};pointer-events:{{ ev }}">
    <div style="width:100%;height:100%;box-sizing:border-box;background:{{ v.fill }};border-radius:{{ v.radius }};display:flex;flex-direction:column;gap:{{ v.gap }}px;padding:{{ v.padding }};box-shadow:{{ v.shadow }}">
      <div style="height:{{ v.titleHeight }}px;display:flex;align-items:center;padding:0 {{ v.titlePadX }}px"><dc-import name="Title" text="{{ title }}" visuals="{{ titleVis }}" hint-size="100%,24px"></dc-import></div>
      <sc-for list="{{ items }}" as="di" hint-placeholder-count="3"><dc-import name="DrawerItem" dc-props="{{ di.props }}" filled="{{ di.fill }}" bg="{{ di.bg }}" width="100%" visuals="{{ itemVis }}" symbol-visuals="{{ symbolVisuals }}" hint-size="100%,56px"></dc-import></sc-for>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:400},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Menu&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleVis&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;},&quot;items&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;itemVis&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;},&quot;width&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:300,&quot;tsType&quot;:&quot;number&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component drawer (drawerLayer contract), drawn from its node (platforms/web/draw.js): shown while
// the node is open in its modal form (form rail: the rail expands instead); its scrim (visual scrim) sends the node's close; the
// panel slides in at visuals width / maxWidth. Still from the shell: title, titleVis, items [{ props, fill, bg }], itemVis (its
// page's header and rows), surfaceTr / ms (the layer's motion).
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.visuals || {}, shown = !!p.open && p.form !== 'rail', close = (p.on || {}).close || (() => {});
    return { v, op: shown ? 1 : 0, ev: shown ? 'auto' : 'none', tx: shown ? 0 : -110, cur: v.cursor || 'default', onScrim: e => close(undefined, e),
      scrimTr: p.ms ? 'opacity ' + p.ms + 'ms' : 'none', surfaceTr: p.surfaceTr || 'none',
      title: p.title || '', titleVis: p.titleVis || {}, items: p.items || [], itemVis: p.itemVis || {}, symbolVisuals: p.symbolVisuals || {} };
  }
}
</script>
</body>
</html>
