name: Publish

# Publishing is its own workflow so a slow or hung image build never holds CI's
# concurrency group: verification cancels freely, publishing runs on its own.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

# A newer publish of `main` cancels an older one. That is safe: both push the same tags, so
# `:latest` converges on the newest green build of `main`, and a hung build stops blocking.
#
# For `workflow_run`, `github.ref` is always the default branch, so the group is keyed on the
# triggering run's `head_branch`. Only a run that will actually publish joins `publish-main`;
# every other run gets a group of its own, so a skipped run never cancels a real publish.
concurrency:
  group: >-
    publish-${{
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_branch || github.run_id
    }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    # Only for a *successful* CI run, triggered by a push, on `main`. `workflow_run` fires on
    # every completion including failures and cancellations, so this gate is the whole safety
    # property: a red build must never reach a registry a live host pulls from.
    #
    # `head_branch` rather than `github.ref` — for a `workflow_run` event `github.ref` is the
    # branch of *this* workflow file, not of the run that triggered it, so checking it would
    # pass for a CI run on any branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      packages: write
      contents: read
    # An hour is generous against the emulated arm64 build's normal runtime and turns a hang
    # into a visible failure rather than a stall toward GitHub's six-hour default.
    timeout-minutes: 60
    steps:
      # `workflow_run` starts from the default branch, not from the commit under test, so the
      # sha must be named explicitly. Getting this wrong would build `main`'s tip and publish
      # it under the tested commit's tag — green, and wrong.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # QEMU is what lets an amd64 runner build the arm64 half of the manifest. It must come
      # before buildx: buildx enumerates the platforms it can emulate when it starts, so
      # registering the binfmt handlers afterwards leaves it advertising amd64 only and the
      # arm64 build fails with "no match for platform".
      - uses: docker/setup-qemu-action@v3
      # Unlike `ci.yml`'s `container` job, this one *does* want buildx: it pushes straight to
      # the registry rather than loading into the local daemon for `docker run`, and buildx is
      # what makes the GitHub Actions layer cache (below) available.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `linux/amd64` + `linux/arm64` makes a Pi or an arm64 NAS a supported target. The arm64
      # half is emulated through QEMU above, so this is by far the slowest step here; the cost
      # is accepted, since it is fully cached between runs and a native arm64 runner is not
      # available on this account.
      #
      # `docker/build-push-action` writes both architectures under one tag as a multi-arch
      # manifest list, so a client pulling `ghcr.io/patakihara/auralis:latest` gets the image
      # matching its own architecture.
      #
      # Both tags hardcode the lowercase `patakihara/auralis` path rather than interpolating
      # `github.repository_owner` — GHCR rejects uppercase, and the owner's account casing
      # isn't guaranteed to stay lowercase. The sha tag is the *tested* commit's, taken from
      # the triggering run, not `github.sha` (which here is the default branch's tip).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/patakihara/auralis:latest
            ghcr.io/patakihara/auralis:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
