name: Publish

# Split out of `ci.yml` on 2026-08-17, at the user's direction, after one hung job blocked
# every CI run on `main` for two hours.
#
# The problem it solves. `ci.yml` deliberately queues rather than cancels on `main`
# precisely to protect this job: cancelling a superseded run also cancelled its publish, so
# the registry silently stopped being updated while every run still reported green. Sound
# reasoning — but it put a slow, network-dependent, deployment-coupled job in the *same
# concurrency group* as every verification job. On 2026-08-16 `docker/build-push-action`
# hung here for over two hours after all six verification jobs had passed, and because a run
# is not complete until all its jobs are, that single step held the group and three
# subsequent CI runs sat `pending` with nothing allocated. The project's authoritative
# signal was unavailable, and the symptom was indistinguishable from a runner-allocation
# failure — which is what the docs had blamed for it before.
#
# Separating them lets each take the concurrency policy it actually wants: verification
# cancels freely (only the newest commit's result is interesting), while publishing is
# serialized on its own group and can never block a test run again.
on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

# `cancel-in-progress: true` is safe *here* in a way it was not inside `ci.yml`, and the
# difference is worth stating because it looks like the exact mistake the old comment warns
# against. There, a cancel came from a superseded *verification* run and nothing replaced
# the lost publish. Here, the only thing that can cancel a publish is a *newer* publish,
# which by definition pushes a newer commit to the same tags. `:latest` therefore always
# converges on the most recent green build of `main` rather than being left stale — the very
# failure the old comment feared — and a hung build stops blocking the next one.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  publish:
    name: Publish image to GHCR
    runs-on: ubuntu-latest
    # Only for a *successful* CI run, triggered by a push, on `main`. `workflow_run` fires on
    # every completion including failures and cancellations, so this gate is the whole safety
    # property: a red build must never reach a registry a live host pulls from.
    #
    # `head_branch` rather than `github.ref` — for a `workflow_run` event `github.ref` is the
    # branch of *this* workflow file, not of the run that triggered it, so checking it would
    # pass for a CI run on any branch.
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    permissions:
      packages: write
      contents: read
    # The hang that prompted this split ran unbounded toward GitHub's six-hour default. An
    # hour is generous against the emulated arm64 build's normal runtime and turns a hang
    # into a visible failure rather than an invisible stall.
    timeout-minutes: 60
    steps:
      # `workflow_run` starts from the default branch, not from the commit under test, so the
      # sha must be named explicitly. Getting this wrong would build `main`'s tip and publish
      # it under the tested commit's tag — green, and wrong.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      # QEMU is what lets an amd64 runner build the arm64 half of the manifest. It must come
      # before buildx: buildx enumerates the platforms it can emulate when it starts, so
      # registering the binfmt handlers afterwards leaves it advertising amd64 only and the
      # arm64 build fails with "no match for platform".
      - uses: docker/setup-qemu-action@v3
      # Unlike `ci.yml`'s `container` job, this one *does* want buildx: it pushes straight to
      # the registry rather than loading into the local daemon for `docker run`, and buildx is
      # what makes the GitHub Actions layer cache (below) available.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `linux/amd64` + `linux/arm64` since 2026-08-06, which is what makes a Pi or an arm64
      # NAS a supported target rather than an aspiration. The arm64 half is emulated through
      # QEMU above, so this is by far the slowest step here; the cost is accepted rather than
      # worked around, since it is fully cached between runs and a native arm64 runner is not
      # available on this account.
      #
      # `docker/build-push-action` writes both architectures under one tag as a multi-arch
      # manifest list, so `ghcr.io/patakihara/auralis:latest` keeps meaning exactly what it
      # meant before — a client pulls the image matching its own architecture. Nothing in
      # `compose.yaml`, `docs/SELF_HOSTING.md` or mediaserver's Watchtower setup changes.
      #
      # Both tags hardcode the lowercase `patakihara/auralis` path rather than interpolating
      # `github.repository_owner` — GHCR rejects uppercase, and the owner's account casing
      # isn't guaranteed to stay lowercase. The sha tag is the *tested* commit's, taken from
      # the triggering run, not `github.sha` (which here is the default branch's tip).
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/patakihara/auralis:latest
            ghcr.io/patakihara/auralis:${{ github.event.workflow_run.head_sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
