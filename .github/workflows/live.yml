name: Live

# Checks against what is published beyond these machines (scripts/repo/live.test.mjs, gated by
# LIVE=1). A failure here only marks plan criteria; publish.yml follows "CI" alone, never this.
# Scheduled, never on push, so an expected live failure never marks a commit red. A scheduled
# run is on main, so scripts/plan/results.mjs reads it like any other run there.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # [M0.staging/a] reads which commit Publish last published.
  actions: read

jobs:
  live:
    name: Live checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # AURALIS_STAGING_URL is a repository secret: the repo names no host.
      - env:
          AURALIS_STAGING_URL: ${{ secrets.AURALIS_STAGING_URL }}
          GITHUB_TOKEN: ${{ github.token }}
        run: mkdir -p reports/junit && LIVE=1 node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/junit/live.xml scripts/repo/live.test.mjs
      - if: always()
        run: node scripts/plan/collect-results.mjs --workflow live --job live --out reports/plan-results.json reports/junit/*.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with: { name: plan-results-live, path: reports/plan-results.json, if-no-files-found: warn }
