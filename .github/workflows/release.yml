# Tag-driven release automation — additive to `ci.yml`'s `publish` job, not a replacement
# for it. `ci.yml` keeps writing `:latest` on every green push to `main`, and mediaserver's
# Watchtower keeps auto-updating from that tag exactly as it does today; nothing here changes
# what `:latest` means or how it gets written. This workflow is a second, slower channel for
# anyone who wants to pin a specific, named version instead of riding continuous deployment —
# see docs/SELF_HOSTING.md's "Release channels" section for who should pick which.
name: Release

# Tags only, never a branch push and never a pull_request — a `v*` tag is a deliberate act
# ("I am cutting a release"), unlike a push to `main`, which happens on every merge. Building
# on every push here would duplicate `ci.yml`'s job for no reason; building on a `pull_request`
# would mean a fork's PR could trigger a job with `packages: write`/`contents: write` scopes.
on:
  push:
    tags:
      - 'v*'

# Deliberately no `cancel-in-progress: true`, and deliberately no `cancel-in-progress` key at
# all — same reasoning as `ci.yml`'s `publish` job (see that file's `concurrency` comment): a
# release is coupled to an artifact someone will actually download and a GitHub Release page
# someone will actually read. Cancelling one mid-run would leave it half-published — maybe the
# image pushed, maybe not; maybe the GitHub Release exists with no APK attached — with nothing
# left running to finish or clean up.
#
# Note what the group key does and does not cover: `github.ref` is unique per tag, so two
# *different* tags never share a group and never contended in the first place. What this
# actually protects is the same tag re-triggering — a tag deleted and re-pushed, or a manual
# re-run — which is a real scenario for release automation and the one worth serialising.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  # Fork guard: a `v*` tag pushed to a fork also matches `on.push.tags` in that fork's own copy
  # of this workflow, but forks cannot fork *permissions* — a fork's GITHUB_TOKEN never has
  # `packages: write` against this repo's GHCR namespace or `contents: write` against this
  # repo's releases, so a forked run would fail loudly at the push/release step regardless.
  # This job is a second, earlier guard: it fails fast with a readable reason instead of
  # letting the build run for several minutes before the permission error surfaces.
  guard-fork:
    name: Refuse to run from a fork
    runs-on: ubuntu-latest
    # Reads nothing and writes nothing — it compares two strings.
    permissions: {}
    steps:
      - name: Confirm this is the upstream repo
        run: |
          if [ "${{ github.repository }}" != "patakihara/curly-spoon" ]; then
            echo "::error::Refusing to run release automation from a fork (${{ github.repository }})."
            exit 1
          fi

  # A pushed tag says nothing about whether the commit it points at ever passed CI — `git tag`
  # and `git push --tags` work on any commit, clean or red, and this workflow has no way to
  # look up a past `ci.yml` run for that sha and block on it (there is no reliable "did this
  # sha go green" query without also risking false negatives for shas CI simply hasn't reached
  # yet). So this job does not re-run the test suite — that would just be `ci.yml` a second
  # time under a different name — it only makes the assumption visible: tagging a commit that
  # never went green produces a real, downloadable release built from broken code, and nothing
  # in this workflow will notice. The operator tagging the release is who has to know that.
  validate-version:
    name: Validate the tag as a version
    runs-on: ubuntu-latest
    # Parses the tag out of GITHUB_REF; it does not even check out the repo.
    permissions: {}
    needs: [guard-fork]
    outputs:
      version: ${{ steps.parse.outputs.version }}
      prerelease: ${{ steps.parse.outputs.prerelease }}
    steps:
      - name: Parse and validate the tag
        id: parse
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # Require v<major>.<minor>.<patch> with an optional -<prerelease> suffix
          # (e.g. v0.2.0, v1.0.0-beta.1). A tag that doesn't match this fails the job
          # loudly here rather than reaching the image-tag or release-title steps below
          # with something unparseable baked into them silently (e.g. a typo'd tag
          # producing a GHCR tag nobody can find, or a release titled after garbage).
          if [[ ! "$tag" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Tag '$tag' is not a valid version (expected v<major>.<minor>.<patch>[-prerelease])."
            exit 1
          fi
          version="${tag#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$version" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

  # Mirrors `ci.yml`'s `publish` job deliberately — same mechanics, same reasoning, different
  # tags. Read that job's comments for the full explanation of each step; this one only notes
  # where it differs.
  publish-image:
    name: Build & push versioned image
    runs-on: ubuntu-latest
    needs: [validate-version]
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # QEMU before buildx, same ordering requirement as `ci.yml`: buildx enumerates the
      # platforms it can emulate when it starts, so registering the binfmt handlers after
      # buildx has already started would leave it advertising amd64 only and the arm64 build
      # would fail with "no match for platform".
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `:<version>` and `:stable` — never `:latest`. `:latest` is `ci.yml`'s `publish` job's
      # tag alone, and mediaserver's Watchtower auto-updates from it; writing it here too would
      # mean an unrelated tag push could silently redeploy that live box outside the continuous
      # path it currently follows. `:stable` exists as the moving pointer for someone who wants
      # "the newest tagged release" without hardcoding a version string in their own compose
      # file — the tagged-release equivalent of what `:latest` is to `main`, just on the slower
      # channel.
      #
      # Same hardcoded lowercase `ghcr.io/patakihara/auralis` path as `ci.yml`, for the same
      # reason: GHCR rejects uppercase image paths, and interpolating `github.repository_owner`
      # is not guaranteed to stay lowercase.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/patakihara/auralis:${{ needs.validate-version.outputs.version }}
            ghcr.io/patakihara/auralis:stable
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Fails loudly, before any build, if the app signing key the user must generate and store by
  # hand (docs/FDROID_REPO.md, "the app signing key" step) is missing. Same idiom as
  # `fdroid-repo.yml`'s `check-secrets` job for the (separate, repo-index) `FDROID_REPO_*`
  # secrets — a silent fallback to debug signing here would publish an un-updatable APK to a
  # public Releases page, which is the exact failure this whole wave exists to prevent.
  check-secrets:
    name: Verify the app signing secrets are configured
    runs-on: ubuntu-latest
    permissions: {}
    needs: [guard-fork]
    steps:
      - name: Check required secrets
        run: |
          missing=()
          [ -z "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" ] && missing+=("ANDROID_KEYSTORE_BASE64")
          [ -z "${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" ] && missing+=("ANDROID_KEYSTORE_PASSWORD")
          [ -z "${{ secrets.ANDROID_KEY_ALIAS }}" ] && missing+=("ANDROID_KEY_ALIAS")
          [ -z "${{ secrets.ANDROID_KEY_PASSWORD }}" ] && missing+=("ANDROID_KEY_PASSWORD")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::Release APK signing is not configured. Missing secret(s): ${missing[*]}."
            echo "::error::See docs/FDROID_REPO.md for how to generate the app signing key and add these secrets. Nothing was built."
            exit 1
          fi

  # Same build as `android.yml`'s `build` job otherwise — read that file's header comment for
  # why this is still the only place Android compiles at all. Unlike `android.yml`, this job
  # decodes the app signing key from a secret and builds the **release** variant, so the APK
  # attached to a GitHub Release carries a stable, real signing certificate across releases
  # instead of a fresh random one AGP would generate per CI run (see build.gradle.kts's
  # `signingConfigs.release` for why that per-run randomness would break every install).
  build-android:
    name: Build release APK
    runs-on: ubuntu-latest
    # `contents: read` and nothing else: enough for `actions/checkout` to fetch the
    # repo, and uploading a workflow artifact needs no token scope. The release job
    # that consumes the artifact is the only one holding `contents: write`.
    permissions:
      contents: read
    needs: [validate-version, check-secrets]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      # Decoded to a runner-local temp path, never into the checkout (nothing under a git
      # working tree should ever hold this file, even transiently) and removed again in the
      # `if: always()` step below regardless of whether the build succeeds.
      - name: Decode the app signing keystore
        run: |
          echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      - name: Build and test
        working-directory: apps/android
        env:
          ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew test assembleRelease

      - name: Delete the decoded keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/release.keystore"

      - uses: actions/upload-artifact@v4
        with:
          name: auralis-release-apk
          path: apps/android/app/build/outputs/apk/release/*.apk
          retention-days: 14
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [validate-version, publish-image, build-android]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # need full history to find the previous tag and diff commits against it

      - uses: actions/download-artifact@v4
        with:
          name: auralis-release-apk
          path: apk/

      - name: Generate changelog
        id: changelog
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          # `git describe` finds the nearest reachable tag before this one; on the very first
          # release there is none, and `git describe` exits non-zero — handled explicitly
          # rather than let with `set -e` kill the step, since "no previous tag" is an expected
          # state, not a failure.
          prev_tag="$(git describe --tags --abbrev=0 "${tag}^" 2>/dev/null || true)"

          {
            echo "changelog<<CHANGELOG_EOF"
            if [ -z "$prev_tag" ]; then
              echo "First release."
              echo
              echo "$(git log --pretty='format:- %s (%h)' "$tag")"
            else
              echo "Changes since \`$prev_tag\`:"
              echo
              echo "$(git log --pretty='format:- %s (%h)' "${prev_tag}..${tag}")"
            fi
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          prerelease: ${{ needs.validate-version.outputs.prerelease }}
          files: apk/*.apk
          body: |
            ## Image

            ```
            ghcr.io/patakihara/auralis:${{ needs.validate-version.outputs.version }}
            ```

            Also tagged `:stable`. See `docs/SELF_HOSTING.md`'s "Release channels" section for
            how this differs from `:latest`.

            ## Android APK

            The attached APK is **release-signed** with this project's app signing key — see
            `docs/FDROID_REPO.md` for the key's storage and rotation notes. Installs update
            in place over any previous release-signed install of this app.

            ## Changelog

            ${{ steps.changelog.outputs.changelog }}
