# For now this is the ONLY place Android gets compiled: the development machine has no JDK,
# no Android SDK and no Gradle installed, so `android` was written blind and a red run
# here is the first real signal. Treat it as such.
#
# Note the reason is "not installed", not "cannot be installed". An earlier version of this
# comment claimed dl.google.com was unreachable from that machine; that was inherited from
# the ephemeral cloud container phases 1-4 were built in and is false there — dl.google.com,
# maven.google.com and services.gradle.org all respond fine (measured 2026-08-02). Installing
# a JDK and the SDK would make local builds work and demote this workflow to a second opinion.
name: Android

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

        with:
          packages: platform-tools

      # The repo does ship a wrapper, so the Gradle version is pinned by
      # gradle/wrapper/gradle-wrapper.properties (8.11.1) rather than by this file — one
      # source of truth, and the reproducibility phase 11 will want. Because that wrapper is
      # a committed binary in a public repo, validate it on every run: this action checks
      # gradle-wrapper.jar against Gradle's published checksums, so a tampered or
      # unrecognised jar fails CI instead of silently executing.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: android
        run: ./gradlew --no-build-cache --rerun-tasks test assembleDebug

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: auralis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

  # Runs androidTest on an API 34 x86_64 emulator. Hosted Linux runners expose /dev/kvm as
  # root:kvm 0660; the udev rule opens it to the runner user. The AVD's booted snapshot is
  # cached, so a warm run restores it instead of cold-booting. Timings are in the step log.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Open KVM to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Restore the AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-aosp_atd

      - name: Boot once and save the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot saved"

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          script: ./gradlew --no-build-cache --rerun-tasks connectedDebugAndroidTest

      - if: ${{ !cancelled() }}
        # The runner names each XML after the device ("TEST-emulator-5554 - 14-_app-.xml"), spaces
        # and all, so the paths are passed NUL-separated.
        run: find android/app/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -print0 | xargs -0 node scripts/plan/collect-results.mjs --workflow android --job emulator --out reports/plan-results.json

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          {
            name: plan-results-android-emulator,
            path: reports/plan-results.json,
            if-no-files-found: warn,
          }
