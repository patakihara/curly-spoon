# Android compiles only here and in the release workflows: the development machine has no JDK,
# Android SDK or Gradle, so a red run here is the first real signal. Treat it as such.
name: Android

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

        with:
          packages: platform-tools

      # The repo does ship a wrapper, so the Gradle version is pinned by
      # gradle/wrapper/gradle-wrapper.properties (8.11.1) rather than by this file — one
      # source of truth, which reproducible release builds need. Because that wrapper is
      # a committed binary in a public repo, validate it on every run: this action checks
      # gradle-wrapper.jar against Gradle's published checksums, so a tampered or
      # unrecognised jar fails CI instead of silently executing.
      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        working-directory: android
        run: ./gradlew --no-build-cache --rerun-tasks test assembleDebug

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: auralis-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: ignore

      # One PNG per gallery entry: the screenshot test has one case per entry, so the debug
      # variant's JUnit XML gives the registry's size.
      - name: One screenshot per gallery entry
        if: ${{ !cancelled() }}
        run: |
          xml=android/sonora/build/test-results/testDebugUnitTest/TEST-net.develivarr.auralis.ui.sonora.SonoraGalleryScreenshotTest.xml
          entries=$(grep -c '<testcase ' "$xml")
          pngs=$(find android/sonora/build/reports/paparazzi/debug/images -name '*.png' | wc -l)
          echo "gallery entries: $entries, screenshots: $pngs"
          test "$entries" -gt 40
          test "$pngs" -eq "$entries"

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-screenshots
          path: android/sonora/build/reports/paparazzi/debug/**
          if-no-files-found: warn

      - if: ${{ !cancelled() }}
        run: find android -path '*/build/test-results/*' -name 'TEST-*.xml' -print0 | xargs -0 node scripts/plan/collect-results.mjs --workflow android --job build --out reports/plan-results.json

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          { name: plan-results-android, path: reports/plan-results.json, if-no-files-found: warn }

  # Runs androidTest on an API 34 x86_64 emulator. Hosted Linux runners expose /dev/kvm as
  # root:kvm 0660; the udev rule opens it to the runner user. The AVD's booted snapshot is
  # cached, so a warm run restores it instead of cold-booting. Timings are in the step log.
  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools emulator

      - uses: gradle/actions/wrapper-validation@v4

      - uses: gradle/actions/setup-gradle@v4

      - name: Open KVM to the runner user
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          ls -l /dev/kvm
          "$ANDROID_HOME/emulator/emulator" -accel-check

      - name: Restore the AVD snapshot
        id: avd-cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
          key: avd-34-x86_64-aosp_atd

      - name: Boot once and save the AVD snapshot
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          script: echo "AVD snapshot saved"

      - run: pnpm install --frozen-lockfile

      # The real server on the committed recordings, on the runner's loopback, where the emulator
      # reaches it as 10.0.2.2. It prints the app, the sign-on, the user and the playable item,
      # then `ready`; its request log is uploaded with the results.
      - name: Start the server on recorded upstreams
        env:
          AURALIS_E2E_ADDRESS: 10.0.2.2
        run: |
          mkdir -p reports
          nohup pnpm --filter @auralis/server e2e:serve > reports/recorded-server.out 2> reports/recorded-server.log &
          for _ in $(seq 1 60); do
            grep -qx ready reports/recorded-server.out && break
            sleep 1
          done
          cat reports/recorded-server.out
          grep -qx ready reports/recorded-server.out
          curl -fsS http://127.0.0.1:8787/api/health
          echo "AURALIS_PLAYABLE=$(sed -n 's/^ *playable: *//p' reports/recorded-server.out)" >> "$GITHUB_ENV"
          echo "AURALIS_MULTI_FILE=$(sed -n 's/^ *four files: *//p' reports/recorded-server.out)" >> "$GITHUB_ENV"

      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: aosp_atd
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          working-directory: android
          # SmokeTest signs in to that server and plays the item it printed; GaplessTest plays its
          # four-file book across a boundary. Pass or fail, what each reached is kept from the
          # device's log (one line: each line of a script runs in its own shell, and the first to
          # fail ends it).
          script: ./gradlew --no-build-cache --rerun-tasks connectedDebugAndroidTest -Pandroid.testInstrumentationRunnerArguments.auralisServer=http://10.0.2.2:8787 -Pandroid.testInstrumentationRunnerArguments.auralisPlayable=${{ env.AURALIS_PLAYABLE }} -Pandroid.testInstrumentationRunnerArguments.auralisMultiFile=${{ env.AURALIS_MULTI_FILE }}; tests=$?; adb logcat -d -s SmokeTest:I GaplessTest:I > ../reports/emulator-tests.txt; cat ../reports/emulator-tests.txt; exit $tests

      - if: ${{ !cancelled() }}
        # The runner names each XML after the device ("TEST-emulator-5554 - 14-_app-.xml"), spaces
        # and all, so the paths are passed NUL-separated.
        run: find android/app/build/outputs/androidTest-results/connected -name 'TEST-*.xml' -print0 | xargs -0 node scripts/plan/collect-results.mjs --workflow android --job emulator --out reports/plan-results.json

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          {
            name: plan-results-android-emulator,
            path: reports/plan-results.json,
            if-no-files-found: warn,
          }

      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          { name: recorded-server-log, path: 'reports/recorded-server.*', if-no-files-found: warn }

      # The instrumented tests' own output: the JUnit XML, the per-test logcat, and what SmokeTest
      # and GaplessTest reached.
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: android-emulator-test-output
          path: |
            reports/emulator-tests.txt
            android/app/build/outputs/androidTest-results/connected
          if-no-files-found: warn
