name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Redundant runs are cancelled on every branch. Publishing lives in publish.yml, triggered by
# this workflow completing successfully, so cancelling a run here never cancels a publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Format · lint · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  generated:
    name: Generated code is current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm gen
      # The paths are the folders in schema/codegen/outputs.ts and design-codegen/src/outputs.ts.
      # Untracked output counts as a difference.
      - name: No difference from what is committed
        run: |
          paths="schema/generated web/src/generated/api android/app/src/main/java/net/develivarr/auralis/generated/api web/src/generated/ui android/sonora/src/main/java/net/develivarr/auralis/generated/ui web/src/generated/nav web/src/generated/pages web/src/generated/tokens web/src/generated/gallery android/sonora/src/main/java/net/develivarr/auralis/generated/theme android/sonora/src/test/java/net/develivarr/auralis/generated/gallery android/app/src/main/java/net/develivarr/auralis/generated/nav android/app/src/main/java/net/develivarr/auralis/generated/pages"
          git diff --exit-code -- $paths
          test -z "$(git status --porcelain -- $paths)" || { git status --porcelain -- $paths; exit 1; }

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      # Full history and tags: scripts/repo/layout.test.mjs reads the tag legacy and Sonora's
      # history, and scripts/repo/leftovers.test.mjs reads Sonora's deleted components.
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The same tests as `pnpm test`, with JUnit reports for the plan's progress. The two node
      # test globs must match package.json's `test` script; scripts/repo/live.test.mjs runs in live.yml.
      - run: pnpm exec vitest run --reporter=default --reporter=junit --outputFile.junit=reports/junit/vitest.xml
      - if: always()
        run: mkdir -p reports/junit && node --test --test-reporter=spec --test-reporter-destination=stdout --test-reporter=junit --test-reporter-destination=reports/junit/node.xml scripts/*.test.mjs scripts/plan/*.test.mjs scripts/guards/*.test.mjs scripts/sonora/*.test.mjs scripts/canvas/*.test.mjs scripts/lint/*.test.mjs scripts/mediaserver/*.test.mjs scripts/repo/layout.test.mjs scripts/repo/staging.test.mjs scripts/repo/release-server.test.mjs scripts/repo/install.test.mjs scripts/repo/leftovers.test.mjs
      - if: always()
        run: node scripts/plan/collect-results.mjs --workflow ci --job unit --out reports/plan-results.json reports/junit/*.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          { name: plan-results-ci-unit, path: reports/plan-results.json, if-no-files-found: warn }

  published:
    name: Published artifacts are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Fails when a source listed in scripts/guards/published-sources.json differs from its
      # tree in design/published.json. Publish, record and push the record with the change.
      - run: node scripts/guards/published.mjs

  commits:
    name: Plan lines on commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Only the commits this push or pull request adds; see scripts/guards/commit-check.mjs.
      - name: Check the new commits
        env:
          BEFORE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          AFTER: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.event.after }}
          REF: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
        run: node scripts/guards/commit-check.mjs --before "$BEFORE" --after "$AFTER" --ref "$REF" --default-branch main

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auralis/web build

  container:
    name: Docker image builds & answers /api/health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build --build-arg AURALIS_COMMIT=${{ github.sha }} -t auralis:ci .
      # The repo files in the image are exactly what server/src/main.ts runs and the manifests:
      # no test, recording, test key, recorder or recorded-upstreams harness. scripts/guards/image.mjs
      # prints that list from the source, not from .dockerignore, so a file let in fails here too.
      - name: The image holds only what the server runs
        run: |
          docker run --rm --entrypoint find auralis:ci /app -path '*/node_modules' -prune -o -path /app/web/dist -prune -o -type f -print | sed 's#^/app/##' | sort > "$RUNNER_TEMP/image-files"
          node scripts/guards/image.mjs > "$RUNNER_TEMP/expected-files"
          diff "$RUNNER_TEMP/expected-files" "$RUNNER_TEMP/image-files"
          docker run --rm --entrypoint sh auralis:ci -c '! test -e /app/server/e2e'
      - name: Boot and wait for the HEALTHCHECK
        run: |
          docker run -d --name auralis-ci -p 8787:8787 auralis:ci
          status=starting
          for _ in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Health.Status}}' auralis-ci 2>/dev/null || echo missing)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
      - name: /api/health answers ok with the commit the image was built from, and / serves the web app
        run: |
          body="$(curl -fsS http://127.0.0.1:8787/api/health)"
          echo "$body"
          [ "$body" = "{\"status\":\"ok\",\"commit\":\"$GITHUB_SHA\"}" ]
          curl -fsS http://127.0.0.1:8787/ | grep -q '<title>Auralis</title>'
      # The browser tests run against the booted image: every font and icon comes from it.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auralis/web exec playwright install --with-deps chromium
      # The sign-in specs start the recorded-upstreams server, which serves web's build from here.
      - run: pnpm --filter @auralis/web build
      - name: Browser tests against the container
        env:
          AURALIS_URL: http://127.0.0.1:8787
        run: pnpm --filter @auralis/web exec playwright test
      # One screenshot per Sonora component, from web/e2e/gallery.spec.ts: made, not compared.
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          { name: gallery-screenshots, path: web/test-results/gallery, if-no-files-found: error }
      # docker stop's SIGTERM reaches main.ts, which closes the database and exits 0 well inside
      # docker's 10 s grace, rather than a SIGKILL (137) or the tsx CLI's relay killing it (143).
      - name: docker stop closes the database and exits 0
        run: |
          docker stop auralis-ci
          code="$(docker inspect -f '{{.State.ExitCode}}' auralis-ci)"
          echo "exit code: $code"
          docker logs auralis-ci 2>&1 | grep 'Database closed'
          [ "$code" = 0 ]
      - if: always()
        run: node scripts/plan/collect-results.mjs --workflow ci --job container --out reports/plan-results.json web/reports/junit/e2e.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          {
            name: plan-results-ci-container,
            path: reports/plan-results.json,
            if-no-files-found: warn,
          }
      - name: Container logs
        if: always()
        run: docker logs auralis-ci || true
