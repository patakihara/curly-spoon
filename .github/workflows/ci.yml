name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Redundant runs are cancelled on every branch except `main`, where they queue instead.
#
# `main` is the exception because the last job here, `publish`, is coupled to a live
# deployment: mediaserver auto-updates from `:latest`. Cancelling a superseded run also
# cancels that publish, so under back-to-back pushes the registry silently stops being
# updated while every run still reports green — the jobs that were cancelled are not the
# jobs anyone reads. Adding `linux/arm64` widened the window a lot, since the emulated
# build made `publish` by far the longest job in the workflow: it was cancelled three
# consecutive times on 2026-08-06 with two sessions pushing to `main`, and nothing about
# those runs looked wrong.
#
# Queuing is the right trade for a delivery branch. It costs runner minutes on
# superseded commits; the alternative costs deployments, invisibly.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

jobs:
  static:
    name: Lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: Playwright end-to-end & UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Phase 10's first release-polish check (docs/ROADMAP.md §10): the web app is also
  # the desktop/PWA experience, so its bundle is the whole product's cost of entry.
  # `scripts/bundle-budget.mjs` has the full spec and `scripts/bundle-budget.config.mjs`
  # has every budget number's reasoning. Builds only `apps/web`, not the whole
  # workspace — the budget only cares about that package's output, and building just
  # it keeps this job fast and independent of the other packages' build health.
  #
  # Deliberately no `needs:` on `static`/`unit`, same reasoning as `container` below —
  # it shares no build output with them and gains nothing from waiting.
  bundle-budget:
    name: Web bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auralis/web build
      - run: node scripts/bundle-budget.mjs

  # Phase 10's second release-polish check (docs/ROADMAP.md §10), alongside
  # `bundle-budget` above: a small bundle does not guarantee a fast page.
  # `scripts/lighthouse-budget.mjs` has the full spec and
  # `scripts/lighthouse-budget.config.mjs` has every budget number's reasoning —
  # including that the numbers were derived on the maintainer's own laptop, not
  # this runner. CI-runner numbers can genuinely differ from local ones (a
  # different, unmeasured CPU under mobile's *simulated* throttling especially),
  # so if this job turns out to fail systematically here while passing locally,
  # the honest fix is to re-derive the baseline against this runner, not to nudge
  # a number until it happens to pass.
  #
  # `pnpm exec playwright install --with-deps chromium` is required here, unlike
  # the plain `bundle-budget` job above: this one launches a real Chrome via
  # `chrome-launcher` (see `lighthouse-budget.mjs`'s header for why), and no
  # system Chrome exists on this runner any more than it does locally.
  #
  # Deliberately no `needs:` on `static`/`unit`, same reasoning as `bundle-budget`
  # above — it shares no build output with them and gains nothing from waiting.
  lighthouse-budget:
    name: Web Lighthouse performance budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm perf:lighthouse

  # Phase 4's exit criterion: the container is covered by CI, not by hope. Every
  # phase from here on leaves `docker compose up` working, so this job failing is
  # a release blocker, not a packaging detail to sort out at the end.
  #
  # Deliberately no `needs:` — it shares no build output with the jobs above and
  # is the slowest thing here, so serialising it behind them would just add its
  # duration to the critical path.
  container:
    name: Docker image builds & boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `docker/setup-buildx-action` on purpose: its default `docker-container`
      # driver does not load the built image into the local daemon, so the
      # `docker run` inside the script would not find it. The runner's own Docker
      # is BuildKit-enabled already, which is all the Dockerfile's cache mounts need.
      - run: scripts/docker-smoke.sh auralis:ci

  # Publishes the image `compose.yaml` names (`ghcr.io/patakihara/auralis:latest`) so a
  # self-hoster's Watchtower has something to pull.
  #
  # `e2e` is in `needs` as of 2026-08-05. It was not, and the omission was invisible
  # because this comment claimed the opposite ("passes its tests"): two consecutive builds
  # with a failing Playwright suite published anyway, and the mediaserver box — which
  # auto-updates from `:latest` — pulled and ran both. A red run reported failure while
  # shipping. Every job that can say the build is wrong must gate the registry, or the
  # overall run conclusion means nothing about what is deployed.
  #
  # `bundle-budget` joined the same list on 2026-08-05, for the same reason: it is a job
  # that can say "this build is wrong" (a regressed web bundle), so it gates the registry
  # like every other one here. `lighthouse-budget` joined on 2026-08-06 for the identical
  # reason, one level up the stack: a regressed *performance* budget is just as much a
  # reason to withhold a release as a regressed bundle size.
  publish:
    name: Publish image to GHCR
    needs: [static, unit, e2e, container, bundle-budget, lighthouse-budget]
    runs-on: ubuntu-latest
    # Push events only, and only on `main` — the branch this project delivers on. A
    # pull_request run has no write-scoped GITHUB_TOKEN and must never attempt this.
    #
    # This gate is coupled to a live deployment: mediaserver auto-updates from `:latest`,
    # so whatever reaches the registry is running on that box within ~15 minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # QEMU is what lets an amd64 runner build the arm64 half of the manifest. It must
      # come before buildx: buildx enumerates the platforms it can emulate when it starts,
      # so registering the binfmt handlers afterwards leaves it advertising amd64 only and
      # the arm64 build fails with "no match for platform".
      - uses: docker/setup-qemu-action@v3
      # Unlike the `container` job above, this one *does* want buildx: it pushes straight
      # to the registry rather than loading into the local daemon for `docker run`, and
      # buildx is what makes the GitHub Actions layer cache (below) available.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `linux/amd64` + `linux/arm64` since 2026-08-06, which is what makes a Pi or an
      # arm64 NAS a supported target rather than an aspiration — docs/ROADMAP.md phase 10's
      # remaining half of the release story. The arm64 half is emulated through QEMU above,
      # so this job is now the slowest thing in the workflow by a wide margin. That cost is
      # accepted rather than worked around: it falls only on `main` pushes, it is fully
      # cached between runs, and the alternative (a native arm64 runner) is not available
      # on this account.
      #
      # `docker/build-push-action` writes both architectures under one tag as a multi-arch
      # manifest list, so `ghcr.io/patakihara/auralis:latest` keeps meaning exactly what it
      # meant before — a client pulls the image matching its own architecture. Nothing in
      # `compose.yaml`, `docs/SELF_HOSTING.md` or mediaserver's Watchtower setup has to
      # change, and an amd64 host pulling `:latest` gets the same bytes it did yesterday.
      #
      # Both tags hardcode the lowercase `patakihara/auralis` path rather than interpolating
      # `github.repository_owner` — GHCR rejects uppercase, and the owner's account casing
      # isn't guaranteed to stay lowercase.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/patakihara/auralis:latest
            ghcr.io/patakihara/auralis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
