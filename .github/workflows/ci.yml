name: CI

on:
  push:
    branches: ['**']
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '0'

jobs:
  static:
    name: Lint · format · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck

  unit:
    name: Unit & integration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test -- --coverage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  e2e:
    name: Playwright end-to-end & UI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm build
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # Phase 10's first release-polish check (docs/ROADMAP.md §10): the web app is also
  # the desktop/PWA experience, so its bundle is the whole product's cost of entry.
  # `scripts/bundle-budget.mjs` has the full spec and `scripts/bundle-budget.config.mjs`
  # has every budget number's reasoning. Builds only `apps/web`, not the whole
  # workspace — the budget only cares about that package's output, and building just
  # it keeps this job fast and independent of the other packages' build health.
  #
  # Deliberately no `needs:` on `static`/`unit`, same reasoning as `container` below —
  # it shares no build output with them and gains nothing from waiting.
  bundle-budget:
    name: Web bundle size budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auralis/web build
      - run: node scripts/bundle-budget.mjs

  # Phase 4's exit criterion: the container is covered by CI, not by hope. Every
  # phase from here on leaves `docker compose up` working, so this job failing is
  # a release blocker, not a packaging detail to sort out at the end.
  #
  # Deliberately no `needs:` — it shares no build output with the jobs above and
  # is the slowest thing here, so serialising it behind them would just add its
  # duration to the critical path.
  container:
    name: Docker image builds & boots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No `docker/setup-buildx-action` on purpose: its default `docker-container`
      # driver does not load the built image into the local daemon, so the
      # `docker run` inside the script would not find it. The runner's own Docker
      # is BuildKit-enabled already, which is all the Dockerfile's cache mounts need.
      - run: scripts/docker-smoke.sh auralis:ci

  # Publishes the image `compose.yaml` names (`ghcr.io/patakihara/auralis:latest`) so a
  # self-hoster's Watchtower has something to pull.
  #
  # `e2e` is in `needs` as of 2026-08-05. It was not, and the omission was invisible
  # because this comment claimed the opposite ("passes its tests"): two consecutive builds
  # with a failing Playwright suite published anyway, and the mediaserver box — which
  # auto-updates from `:latest` — pulled and ran both. A red run reported failure while
  # shipping. Every job that can say the build is wrong must gate the registry, or the
  # overall run conclusion means nothing about what is deployed.
  #
  # `bundle-budget` joined the same list on 2026-08-05, for the same reason: it is a job
  # that can say "this build is wrong" (a regressed web bundle), so it gates the registry
  # like every other one here.
  publish:
    name: Publish image to GHCR
    needs: [static, unit, e2e, container, bundle-budget]
    runs-on: ubuntu-latest
    # Push events only, and only on `main` — the branch this project delivers on. A
    # pull_request run has no write-scoped GITHUB_TOKEN and must never attempt this.
    #
    # This gate is coupled to a live deployment: mediaserver auto-updates from `:latest`,
    # so whatever reaches the registry is running on that box within ~15 minutes.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      # Unlike the `container` job above, this one *does* want buildx: it pushes straight
      # to the registry rather than loading into the local daemon for `docker run`, and
      # buildx is what makes the GitHub Actions layer cache (below) available.
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # `linux/amd64` only, deliberately. Multi-arch needs QEMU and roughly triples build
      # time; docs/ROADMAP.md phase 10 already scopes amd64+arm64 as its own deliverable,
      # so the omission here is that plan, not a gap.
      #
      # Both tags hardcode the lowercase `patakihara/auralis` path rather than interpolating
      # `github.repository_owner` — GHCR rejects uppercase, and the owner's account casing
      # isn't guaranteed to stay lowercase.
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/patakihara/auralis:latest
            ghcr.io/patakihara/auralis:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
