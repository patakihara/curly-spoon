name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Redundant runs are cancelled on every branch. Publishing lives in publish.yml, triggered by
# this workflow completing successfully, so cancelling a run here never cancels a publish.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Format · lint · typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Format
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  web:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @auralis/web build

  container:
    name: Docker image builds & answers /health
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: docker build -t auralis:ci .
      - name: Boot and wait for the HEALTHCHECK
        run: |
          docker run -d --name auralis-ci -p 8787:8787 auralis:ci
          status=starting
          for _ in $(seq 1 45); do
            status="$(docker inspect -f '{{.State.Health.Status}}' auralis-ci 2>/dev/null || echo missing)"
            [ "$status" = healthy ] && break
            sleep 2
          done
          echo "health: $status"
          [ "$status" = healthy ]
      - name: /health answers ok and / serves the web app
        run: |
          body="$(curl -fsS http://127.0.0.1:8787/health)"
          echo "$body"
          [ "$body" = '{"status":"ok"}' ]
          curl -fsS http://127.0.0.1:8787/ | grep -q '<title>Auralis</title>'
      - name: Container logs
        if: always()
        run: docker logs auralis-ci || true
