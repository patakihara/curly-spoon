<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:{{ v.height }}px;display:flex;align-items:center;gap:{{ v.gap }}px;padding:0 {{ v.padX }}px;font-size:{{ v.fontSize }}px;color:{{ ink }};white-space:nowrap"><dc-import name="ListItem" dc-props="{{ ix }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import><dc-import data-piece="icon" name="Symbol" icon="{{ icon }}" visuals="{{ iconVis }}" hint-size="22px,22px"></dc-import><span data-piece="label">{{ text }}</span></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:280,&quot;height&quot;:52},&quot;ix&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;play_arrow&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Play&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component menuItem (variant of listItem with its own DC): one row of a menu, an icon and a label.
// Props: its node, drawn (platforms/web/draw.js): icon, text, interaction (handed to ListItem, its interactive surface), visuals
// (height, gap, padX, fontSize, ink, iconSize, iconColor), symbolVisuals (its glyph's design visuals). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.visuals || {};
    const ix = { id: p.id, label: p.label, dim: p.dim, resolve: p.resolve, look: p.look, activate: p.activate, motion: p.motion, motions: p.motions };
    return { v, ix, icon: p.icon || '', text: p.text || '', ink: v.ink || 'inherit', iconVis: { ...(p.symbolVisuals || {}), size: +v.iconSize || 22, color: v.iconColor, padEnd: 0 } };
  }
}
</script>
</body>
</html>
