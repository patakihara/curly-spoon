<div onClick="{{ onClick }}" style="{{ rootStyle }}">
  <div style="{{ artStyle }}"></div>
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px">
    <div style="{{ titleStyle }}">{{ title }}</div>
    <div style="{{ metaStyle }}">{{ meta }}</div>
    <sc-if value="{{ stacked }}" hint-placeholder-val="{{ false }}">
      <div style="display: flex"><div style="{{ pillStyle }}">{{ status }}</div></div>
    </sc-if>
  </div>
  <sc-if value="{{ inline }}" hint-placeholder-val="{{ true }}">
    <div style="{{ pillStyle }}">{{ status }}</div>
  </sc-if>
  <span style="{{ glyphStyle }}">{{ actionGlyph }}</span>
</div>
<script>
  // props: title:string, meta:string, status:string,
  //        NOTE: tone and actionGlyph have different preview defaults and code
  //        fallbacks — see README.md. The code below is the contract.
  //        tone:'library'|'request'|'progress'|'error'='progress',
  //        actionGlyph:string='downloading', platform:'desktop'|'mobile'=desktop, onClick:()=>void
  // defaults from the design: title "Dune Messiah",
  //   meta "Audiobook · Frank Herbert · Simon Vance · 14 h 02 m", status "Requested · 87%"
  class Component extends DCLogic {
    renderVals() {
      const p = this.props;
      const mobile = p.platform === 'mobile';
      const fg = mobile ? 'var(--m3-on-background)' : 'var(--surface-fg)';
      const muted = mobile ? 'var(--m3-on-surface-variant)' : 'var(--surface-fg-muted)';
      const tone = 'var(--tone-' + (p.tone || 'library') + ')';
      return {
        onClick: p.onClick,
        title: p.title,
        meta: p.meta,
        status: p.status,
        actionGlyph: p.actionGlyph || 'play_arrow',
        stacked: mobile,
        inline: !mobile,
        rootStyle:
          'display:flex;align-items:center;gap:' +
          (mobile ? '12px' : '16px') +
          ';padding:' +
          (mobile ? '8px 4px' : '10px 12px') +
          ';border-radius:var(--radius-xs);cursor:pointer',
        artStyle:
          'width:52px;height:52px;flex-shrink:0;border-radius:' +
          (mobile ? '8px' : '6px') +
          ';background:linear-gradient(135deg,var(--accent),var(--accent-violet))',
        titleStyle:
          'font-size:var(--text-md);font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:' +
          fg,
        metaStyle:
          'font-size:var(--text-sm);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:' +
          muted,
        pillStyle:
          'flex-shrink:0;padding:4px 12px;border-radius:var(--radius-pill);font-size:var(--text-xs);font-weight:700;white-space:nowrap;color:' +
          tone +
          ';background:color-mix(in oklch, transparent 78%, ' +
          tone +
          ')',
        glyphStyle:
          "font-family:'Material Symbols Rounded';font-variation-settings:'FILL' 0,'wght' 300;font-size:" +
          (mobile ? '24px' : '22px') +
          ';flex-shrink:0;color:' +
          muted,
      };
    }
  }
</script>
