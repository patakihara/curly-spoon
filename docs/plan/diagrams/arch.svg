  <svg viewBox="0 0 1000 570" role="img" aria-label="Architecture diagram">
    <defs><marker id="ar" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#8b5cf6"/></marker></defs>
    <!-- clients -->
    <rect x="150" y="16" width="300" height="64" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <text x="300" y="44" fill="#e1e1e1" font-size="16" font-weight="700" text-anchor="middle">Web / PWA</text>
    <text x="300" y="64" fill="#969696" font-size="12" text-anchor="middle">React · Mantine · Sonora · generated client</text>
    <rect x="550" y="16" width="300" height="64" rx="16" fill="#141414" stroke="#2a2a2a"/>
    <text x="700" y="44" fill="#e1e1e1" font-size="16" font-weight="700" text-anchor="middle">Android</text>
    <text x="700" y="64" fill="#969696" font-size="12" text-anchor="middle">Compose · Media3 · Sonora · generated models</text>
    <path d="M300 80 V118" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ar)"/>
    <path d="M700 80 V118" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ar)"/>
    <text x="500" y="108" fill="#969696" font-size="12" text-anchor="middle">one API, from one schema (OpenAPI → TS + Kotlin)</text>
    <!-- server box -->
    <rect x="40" y="124" width="920" height="300" rx="24" fill="#0f0f0f" stroke="#8b5cf6" stroke-opacity=".5"/>
    <text x="64" y="152" fill="#c4b5fd" font-size="13" font-weight="800" letter-spacing="1.5">AURALIS SERVER · one container · one port</text>
    <!-- row 1: features -->
    <g font-size="13">
      <rect x="64" y="168" width="200" height="72" rx="14" fill="#1c1c1c"/><text x="164" y="196" fill="#e1e1e1" font-weight="700" text-anchor="middle">Screen APIs</text><text x="164" y="216" fill="#969696" font-size="11.5" text-anchor="middle">one response per screen</text>
      <rect x="284" y="168" width="200" height="72" rx="14" fill="#1c1c1c"/><text x="384" y="196" fill="#e1e1e1" font-weight="700" text-anchor="middle">Playback</text><text x="384" y="216" fill="#969696" font-size="11.5" text-anchor="middle">plans · queues · progress</text>
      <rect x="504" y="168" width="200" height="72" rx="14" fill="#1c1c1c"/><text x="604" y="196" fill="#e1e1e1" font-weight="700" text-anchor="middle">Requests</text><text x="604" y="216" fill="#969696" font-size="11.5" text-anchor="middle">one pipeline, per-medium steps</text>
      <rect x="724" y="168" width="212" height="72" rx="14" fill="#1c1c1c"/><text x="830" y="196" fill="#e1e1e1" font-weight="700" text-anchor="middle">Discovery</text><text x="830" y="216" fill="#969696" font-size="11.5" text-anchor="middle">taste · candidates · shelves</text>
    </g>
    <!-- row 2: core -->
    <g font-size="13">
      <rect x="64" y="258" width="420" height="64" rx="14" fill="#161616" stroke="#2a2a2a"/><text x="274" y="284" fill="#e1e1e1" font-weight="700" text-anchor="middle">Catalogue index & identity</text><text x="274" y="303" fill="#969696" font-size="11.5" text-anchor="middle">MediaRef · ASIN / MBID / feed GUID · ownership · search index</text>
      <rect x="504" y="258" width="432" height="64" rx="14" fill="#161616" stroke="#2a2a2a"/><text x="720" y="284" fill="#e1e1e1" font-weight="700" text-anchor="middle">SQLite store + job runner</text><text x="720" y="303" fill="#969696" font-size="11.5" text-anchor="middle">snapshots · caches · queues · request state · schedules</text>
    </g>
    <!-- row 3: adapters -->
    <rect x="64" y="340" width="872" height="64" rx="14" fill="#161616" stroke="#2a2a2a"/>
    <text x="500" y="361" fill="#e1e1e1" font-size="13" font-weight="700" text-anchor="middle">Upstream adapters, each tested against responses recorded from mediaserver</text>
    <text x="500" y="378" fill="#969696" font-size="11.5" text-anchor="middle">ABS · Jellyfin · YouTube Music · Prowlarr · AudiobookBay · qBittorrent · ListenBrainz</text>
    <text x="500" y="394" fill="#969696" font-size="11.5" text-anchor="middle">MusicBrainz · Audnexus · Open Library · PodcastIndex · LRCLIB · SponsorBlock</text>
    <!-- upstreams -->
    <path d="M500 424 V458" stroke="#8b5cf6" stroke-width="2" marker-end="url(#ar)"/>
    <g font-size="12.5">
      <rect x="40" y="464" width="290" height="96" rx="16" fill="#141414" stroke="#2a2a2a"/><text x="185" y="492" fill="#e1e1e1" font-weight="700" text-anchor="middle">Your servers</text><text x="185" y="512" fill="#969696" font-size="11.5" text-anchor="middle">Audiobookshelf · Jellyfin</text><text x="185" y="530" fill="#969696" font-size="11.5" text-anchor="middle">(media bytes via range proxy)</text>
      <rect x="355" y="464" width="290" height="96" rx="16" fill="#141414" stroke="#2a2a2a"/><text x="500" y="492" fill="#e1e1e1" font-weight="700" text-anchor="middle">Streaming & acquisition</text><text x="500" y="512" fill="#969696" font-size="11.5" text-anchor="middle">YouTube Music (play + keep songs)</text><text x="500" y="530" fill="#969696" font-size="11.5" text-anchor="middle">Prowlarr · AudiobookBay · qBittorrent</text>
      <rect x="670" y="464" width="290" height="96" rx="16" fill="#141414" stroke="#2a2a2a"/><text x="815" y="492" fill="#e1e1e1" font-weight="700" text-anchor="middle">Public catalogues</text><text x="815" y="512" fill="#969696" font-size="11.5" text-anchor="middle">ListenBrainz · MusicBrainz · Audnexus</text><text x="815" y="530" fill="#969696" font-size="11.5" text-anchor="middle">Open Library · PodcastIndex · iTunes</text><text x="815" y="548" fill="#969696" font-size="11.5" text-anchor="middle">LRCLIB · SponsorBlock</text>
    </g>
  </svg>
