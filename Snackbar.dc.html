<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div role="status" style="width:100%;min-height:{{ v.minHeight }}px;box-sizing:border-box;display:flex;align-items:center;gap:{{ v.gap }}px;padding:{{ v.padding }};background:{{ v.fill }};color:{{ v.ink }};border-radius:{{ v.radius }}px;font-size:{{ v.fontSize }}px;box-shadow:{{ v.shadow }}">
  <div style="flex:1">{{ text }}</div>
  <dc-import name="Button" dc-props="{{ ix }}" text="{{ action }}" hint-size="88px,32px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:72},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Link copied&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;action&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Dismiss&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;ix&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component snackbar (overlay). Props: text, action (label), ix (Button props), visuals (resolved). Position comes from the shell (visuals margin / maxWidth / bottom*). No values of its own.
class Component extends DCLogic {
  renderVals() { const p = this.props; return { v: p.visuals || {}, text: p.text || '', action: p.action || '', ix: p.ix || {} }; }
}
</script>
</body>
</html>
