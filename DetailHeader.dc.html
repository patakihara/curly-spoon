<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;height:100%;box-sizing:border-box;display:flex;flex-direction:{{ dir }};align-items:center;justify-content:center;gap:{{ gap }}px;padding:{{ padTop }}px {{ padX }}px {{ padBottom }}px">
  <div data-shared="image" data-shared-role="detail" style="width:{{ art }}px;height:{{ art }}px;border-radius:{{ rad }};background:{{ image }};flex:none"></div>
  <div style="flex:{{ textFlex }};min-width:0;display:flex;flex-direction:column;align-items:{{ itemsAlign }};gap:{{ textGap }}px;text-align:{{ align }};max-width:100%">
    <div style="max-width:100%;font-size:{{ titleSize }}px;font-weight:{{ titleWeight }};line-height:{{ titleLh }};text-wrap:pretty">{{ title }}</div>
    <sc-if value="{{ hasSub }}" hint-placeholder-val="{{ true }}"><div style="max-width:100%;font-family:{{ subFamily }};font-size:{{ subSize }}px;opacity:{{ subOp }};color:{{ subColor }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ subtitle }}</div></sc-if>
    <sc-if value="{{ hasMeta }}" hint-placeholder-val="{{ false }}"><div style="font-family:{{ subFamily }};font-size:{{ metaSize }}px;opacity:{{ metaOp }}">{{ meta }}</div></sc-if>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:220},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Maren Holt&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Artist · Pop&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;meta&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;2 collections · 9 tracks&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;image&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;linear-gradient(135deg,#1aa,#155)&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component detailHeader (a detail page's info in a bar's expanded slot).
// Props: title, subtitle, meta, image (a reference turned into a CSS background by imageCss, when drawn from its node; else
// already a CSS background), visuals (detailHeader, resolved with the placement's variants: shape, layout). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.visuals || {}, row = v.align === 'start';
    return { title: p.title || '', subtitle: p.subtitle || '', hasSub: !!p.subtitle, meta: p.meta || '', hasMeta: !!p.meta, image: p.imageCss ? p.imageCss(p.image) : p.image || 'transparent',
      dir: row ? 'row' : 'column', align: v.align || 'center', itemsAlign: row ? 'flex-start' : 'center', textFlex: row ? '1' : 'none',
      art: +v.artSize || 96, rad: (v.artRadius ?? 8) + 'px', gap: +v.gap || 8, textGap: +v.textGap || 4, padX: +v.padX || 0, padTop: +v.padTop || 0, padBottom: +v.padBottom || 0,
      titleSize: +v.titleSize || 20, titleWeight: v.titleWeight || 600, titleLh: v.titleLineHeight || 1.2,
      subFamily: v.subFamily || 'inherit', subSize: +v.subSize || 12, subOp: v.subOpacity ?? 1, subColor: v.subColor || 'inherit', metaSize: +v.metaSize || 11, metaOp: v.metaOpacity ?? 1 };
  }
}
</script>
</body>
</html>
