<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;height:{{ h }}px;display:flex;align-items:center;gap:{{ gap }}px;font-size:{{ fs }}px;border-radius:{{ rad }}px;padding:0 {{ px }}px;margin:0 -{{ px }}px">
  <dc-import name="ListItem" dc-props="{{ ix }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import>
  <span style="flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ text }}</span>
  <div style="display:flex;opacity:{{ iop }}"><dc-import name="Symbol" icon="{{ icon }}" visuals="{{ iconVis }}" hint-size="20px,20px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:48},&quot;ix&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Jazz&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component checkRow (variant of listItem): an option's label, and the check while it is selected.
// Props: ix (ListItem props from the shell: interaction surface), text, visuals (resolved with its selected status: iconOpacity), symbolVisuals.
class Component extends DCLogic {
  renderVals() {
    const v = this.props.visuals || {};
    return { ix: this.props.ix || {}, text: this.props.text || '', h: +v.height || 44, gap: +v.gap || 0, fs: +v.fontSize || 14, rad: +v.radius || 0, px: +v.padX || 0,
      icon: v.icon || '', iconVis: { ...(this.props.symbolVisuals || {}), size: +v.iconSize || 20, padEnd: 0 }, iop: v.iconOpacity ?? 1 };
  }
}
</script>
</body>
</html>
