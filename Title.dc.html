<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="width:100%;min-width:0;padding-inline-start:{{ padStart }}px;box-sizing:border-box;font-size:{{ fs }}px;font-weight:{{ fw }};letter-spacing:{{ ls }};color:{{ color }};white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ text }}</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:56},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Library&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Design component: title (design/components/title). Props: text + visuals (resolved with the placement's size variant). No parts. No values of its own; the bar row places it (vertical centring is the bar's).
class Component extends DCLogic {
  renderVals() { const v = this.props.visuals || {}; return { text: this.props.text, padStart: v.padStart, fs: v.fontSize, fw: v.fontWeight, ls: v.letterSpacing, color: v.color }; }
}
</script>
</body>
</html>
