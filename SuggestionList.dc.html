<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:{{ gap }}px"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="3"><dc-import name="SuggestionRow" ix="{{ r.ix }}" text="{{ r.text }}" visuals="{{ rowVis }}" symbol-visuals="{{ symbolVisuals }}" hint-size="100%,40px"></dc-import></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:160},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ ix: object; text: string }[]&quot;},&quot;rowVis&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component suggestionList: one SuggestionRow per option, top to bottom. Props: rows [{ ix, text }]
// (each option's interaction, from the shell), rowVis (suggestionRow visuals), symbolVisuals, visuals (resolved: gap). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const v = this.props.visuals || {};
    return { rows: this.props.rows || [], rowVis: this.props.rowVis || {}, symbolVisuals: this.props.symbolVisuals || {}, gap: +v.gap || 0 };
  }
}
</script>
</body>
</html>
