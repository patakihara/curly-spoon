<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;gap:{{ gap }}px;padding:{{ py }}px {{ px }}px;background:{{ fill }};font-size:{{ fs }}px;color:{{ ink }}"><dc-import name="Symbol" icon="{{ icon }}" visuals="{{ iconVis }}" hint-size="18px,18px"></dc-import><div style="flex:1">{{ text }}</div><dc-import name="Button" dc-props="{{ retryIx }}" text="{{ retry }}" hint-size="64px,28px"></dc-import></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:48},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Showing saved content&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;retry&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Retry&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;retryIx&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component staleBanner (role staleBanner). Props: text, retry (label), retryIx (Button props from the shell), visuals (resolved). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const v = this.props.visuals || {};
    return { text: this.props.text || '', retry: this.props.retry || '', retryIx: this.props.retryIx || {}, fill: v.fill || 'transparent', ink: v.ink || 'inherit', fs: +v.fontSize || 12, py: +v.padY || 0, px: +v.padX || 0, gap: +v.gap || 0, icon: v.icon || 'cloud_off', iconVis: { size: +v.iconSize || 18 } };
  }
}
</script>
</body>
</html>
