<!-- @dsCard group="Components" viewport="1400x560" name="Search, Fields, Settings & Sliders" subtitle="SearchField (app bar) vs SearchBar (pill), labelled field rows, settings rows, toggle, seek bar" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { Input, Switch, Slider, FieldRow, SettingRow, SearchField, SearchBar } = window.SonoraDesignSystem_6c1435;
function Demo(){
  const [v,setV]=React.useState(0.35);
  const [on,setOn]=React.useState(true);
  const [wifi,setWifi]=React.useState(false);
  const [q,setQ]=React.useState('');
  return <div style={{display:'flex',gap:32,flexWrap:'wrap'}}>
    <div style={{display:'flex',flexDirection:'column',gap:18,width:340}}>
      <SearchField placeholder="Search your Audiobooks" value={q} onChange={setQ} />
      <SearchBar placeholder="Filter this list" value={q} onChange={setQ} />
      <SearchBar platform="mobile" placeholder="Filter this list" value={q} onChange={setQ} />
      <FieldRow label="Find anything" placeholder="Album, book, podcast…" value={q} onChange={setQ} />
      <FieldRow label="Library folder" platform="mobile" value="/storage/Sonora" />
      <Input placeholder="Search" icon={<span style={{ fontFamily: 'Material Symbols Rounded', fontSize: 'var(--icon-sm)' }}>search</span>} />
      <Switch checked={on} onChange={setOn} label="Gapless playback" />
      <div><div style={{color:'var(--surface-fg-muted)',fontSize:'var(--text-xs)',marginBottom:6}}>Desktop</div><Slider value={v} onChange={setV} platform="desktop" /></div>
      <div><div style={{color:'var(--surface-fg-muted)',fontSize:'var(--text-xs)',marginBottom:6}}>Mobile</div><Slider value={v} onChange={setV} platform="mobile" /></div>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:10,width:340}}>
      <SettingRow title="Auto-download requests" sub="Fetch approved requests as soon as a source appears." checked={on} onChange={setOn} />
      <SettingRow title="Wi-Fi only" sub="Pause transfers on metered connections." checked={wifi} onChange={setWifi} />
      <SettingRow platform="mobile" title="Show explicit content" sub="Include explicit titles in search." checked={on} onChange={setOn} />
    </div>
  </div>;
}
function Themed(){
  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>
    <div data-theme="dark" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
    <div data-theme="light" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Themed/>);
</script></body></html>
