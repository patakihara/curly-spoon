<!-- @dsCard group="Components" viewport="1200x460" name="Overflowing Filter Rows" subtitle="ButtonGroup's scroll + leading extensions across the home, library and search-results filter sets" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg)}</style>
<div id="root"></div>
<script type="text/babel">
const { ButtonGroup, CoverArt } = window.SonoraDesignSystem_6c1435;

function Caption({ children }) {
  return <div style={{fontSize:'var(--text-sm)',color:'var(--surface-fg-muted)',marginBottom:'var(--spacing-md)',maxWidth:640}}>{children}</div>;
}

function Avatar() {
  return <div style={{width:28,height:28,borderRadius:'50%',overflow:'hidden',position:'relative'}}>
    {CoverArt && <CoverArt alt="Account" />}
  </div>;
}

function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-lg)'}}>
    <div>
      <Caption>ButtonGroup with `scroll` and a pinned `leading` avatar, in the three filter sets that genuinely overflow their row: home, library and search results. The row is capped narrow here to force the edge fade into view.</Caption>
      <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-lg)'}}>
        <div>
          <div style={{fontSize:'var(--text-xs)',color:'var(--surface-fg-muted)',marginBottom:'var(--spacing-xs)',fontWeight:'var(--weight-strong)',textTransform:'uppercase',letterSpacing:'.02em'}}>Home</div>
          <div style={{maxWidth:280}}>
            <ButtonGroup scroll leading={<Avatar/>} items={["All", "Music", "Podcasts", "Audiobooks"]} value="All" onChange={() => {}} />
          </div>
        </div>
        <div>
          <div style={{fontSize:'var(--text-xs)',color:'var(--surface-fg-muted)',marginBottom:'var(--spacing-xs)',fontWeight:'var(--weight-strong)',textTransform:'uppercase',letterSpacing:'.02em'}}>Library</div>
          <div style={{maxWidth:280}}>
            <ButtonGroup scroll leading={<Avatar/>} items={["Playlists", "Podcasts", "Albums", "Artists", "Downloaded"]} value="Podcasts" onChange={() => {}} />
          </div>
        </div>
        <div>
          <div style={{fontSize:'var(--text-xs)',color:'var(--surface-fg-muted)',marginBottom:'var(--spacing-xs)',fontWeight:'var(--weight-strong)',textTransform:'uppercase',letterSpacing:'.02em'}}>Search results</div>
          <div style={{maxWidth:280}}>
            <ButtonGroup scroll leading={<Avatar/>} items={["Songs", "Albums", "Podcasts", "Audiobooks", "People"]} value="Songs" onChange={() => {}} />
          </div>
        </div>
      </div>
    </div>
  </div>;
}
function Themed(){
  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>
    <div data-theme="dark" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
    <div data-theme="light" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Themed/>);
</script>
