<!-- @dsCard group="App Screens" viewport="1400x820" name="Desktop" subtitle="Desktop library — jump back in, mixed shelves, search with request states, settings, persistent player" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>html,body{margin:0;height:100%;background:var(--surface-bg);font-family:var(--font-body);color:var(--surface-fg)}#root{height:100vh}*{scrollbar-width:none}*::-webkit-scrollbar{display:none}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { AppShell, NavRail, NowPlaying, LayoutGrid, Shelf, TopAppBar, SearchField, ButtonGroup, MediaCard, ArtistCard, MediaHeader, ResultRow, QuickPick, FieldRow, SettingRow, SectionHeader, Section, TabBar, ViewToggle, LibraryShell, DetailPage, CollectionPage, MiniPlayer, IconButton } = window.SonoraDesignSystem_6c1435;

const NAV = [
  { key: 'search', label: 'Search', icon: 'search' },
  { key: 'home', label: 'Browse', icon: 'explore' },
  { key: 'tracks', label: 'Music', icon: 'speaker' },
  { key: 'albums', label: 'Audiobooks', icon: 'headphones' },
  { key: 'artists', label: 'Podcasts', icon: 'mic' },
  { key: 'settings', label: 'Settings', icon: 'settings' },
];

// Demo cover art. Deterministic per title, so a card keeps the same cover across renders.
const cover = (t, s) => 'https://picsum.photos/seed/sonora-' + encodeURIComponent(String(t).toLowerCase().replace(/[^a-z0-9]+/g, '-')) + '/' + (s || 400);
const PICKS = [
  { title: 'The Silent Patient', sub: 'Book · 6 h 12 m left' },
  { title: 'Deep Inertia Radio', sub: 'Podcast · 24 min left' },
  { title: 'Between Two Worlds', sub: 'Album · 3 tracks left' },
  { title: 'Wind and Truth', sub: 'Book · 21 h 40 m left' },
];
const SHELF = [
  { title: 'Fairytale', sub: 'Album · Natasha Beller' },
  { title: 'The Slip', sub: 'Album · Nine Inch Nails' },
  { title: 'Sonic Tales', sub: 'Podcast · 148 episodes' },
  { title: 'Foggy Trails', sub: 'Book · Adam Rivers', progress: 0.42 },
  { title: '8-bit Lagerfeuer', sub: 'Album · Various Artists' },
  { title: 'Ink Heart', sub: 'Book · Cornelia Funke', absent: true },
];
const PEOPLE = ['Natasha Beller', 'Evelyn Harper', 'Adam Rivers', 'Deep Inertia', 'Fleeting Verses'];
const TRACKS = [
  { title: 'weathergirl', meta: 'weathergirl · FLAVOR FOLEY · 4:18', status: 'Playing', tone: 'progress' },
  { title: 'Fairytale', meta: 'Natasha Beller · Fairytale · 3:42', status: 'In library' },
  { title: 'The Slip', meta: 'Nine Inch Nails · The Slip · 3:33', status: 'In library' },
  { title: 'Between two worlds', meta: 'Maya Filipič · Between two worlds · 5:02', status: 'In library' },
  { title: 'Golden Scars', meta: 'Fleeting Verses · Golden Scars · 2:53', status: 'Requested · 64%', tone: 'request', actionGlyph: 'downloading' },
  { title: 'Paper Lanterns', meta: 'Sonic Tales · Lantern Season · 3:21', status: 'In library' },
  { title: 'Salt and Static', meta: 'Soul Vertex · Coast Road · 4:44', status: 'In library' },
  { title: 'Foggy Trails', meta: 'Adam Rivers · Long Way Down · 4:12', status: 'In library' },
  { title: 'Fragments of the Wind', meta: 'Evelyn Harper · Fragments · 2:58', status: 'In library' },
  { title: 'Heartbeats in Silence', meta: 'Deep Inertia · Ink Heart · 4:03', status: 'In library' },
  { title: 'Escapes and Moons', meta: 'Soul Vertex · Single · 3:33', status: 'In library' },
  { title: 'Hollow Fields', meta: 'Echo Fields · Hollow Fields · 4:12', status: 'In library' },
  { title: 'Signal Bloom', meta: 'The Nebula Collective · Signal Bloom · 3:18', status: 'Requested · 87%', tone: 'request', actionGlyph: 'downloading' },
  { title: 'Tidal Lines', meta: 'The Nebula Collective · Driftwave · 3:34', status: 'In library' },
  { title: 'Static Coast', meta: 'The Nebula Collective · Driftwave · 3:18', status: 'In library' },
  { title: 'Empty Rooms', meta: 'Echo Fields · Nightglass · 5:01', status: 'In library' },
  { title: 'Lantern Season', meta: 'Sonic Tales · Lantern Season · 3:47', status: 'In library' },
  { title: 'The Worst Bestsellers', meta: 'Natasha Beller · Singles · 2:39', status: 'In library' },
  { title: 'Long Way Down', meta: 'Adam Rivers · Long Way Down · 5:12', status: 'In library' },
];
const RESULTS = [
  { title: 'Wind and Truth', meta: 'Brandon Sanderson · Audiobook · 62 h', status: 'In library', tone: 'library' },
  { title: 'Escapes and Moons', meta: 'Soul Vertex · Single · 3:33', status: 'Requested · 87%', tone: 'request', actionGlyph: 'downloading' },
  { title: 'Shadows and Sighs', meta: 'Evelyn Harper · Album · 11 tracks', status: 'Queued', tone: 'progress' },
  { title: 'Fleeting Verses Live', meta: 'Fleeting Verses · Podcast · 2 h 04 m', status: 'Searching…', tone: 'progress' },
  { title: 'Tears of Ice', meta: 'Deep Inertia · Album · 9 tracks', status: 'Failed', tone: 'error' },
];
const person = (name, role) => ({ title: name, sub: role });
const ALBUMS = [
  { title: 'Fairytale', sub: 'Album · Natasha Beller' },
  { title: 'The Slip', sub: 'Album · Nine Inch Nails' },
  { title: '8-bit Lagerfeuer', sub: 'Album · Various Artists' },
  { title: 'Between Two Worlds', sub: 'Album · Maya Filipič', progress: 0.31 },
  { title: 'Golden Scars', sub: 'Album · Fleeting Verses' },
  { title: 'Tears of Ice', sub: 'Album · Deep Inertia', absent: true },
];
const BOOKS = [
  { title: 'The Silent Patient', sub: 'Book · Alex Michaelides', progress: 0.55 },
  { title: 'Wind and Truth', sub: 'Book · Brandon Sanderson', progress: 0.12 },
  { title: 'Foggy Trails', sub: 'Book · Adam Rivers' },
  { title: 'Ink Heart', sub: 'Book · Cornelia Funke', absent: true },
  { title: 'Shadows and Sighs', sub: 'Book · Evelyn Harper' },
  { title: 'The Long Read', sub: 'Book · Evelyn Harper', progress: 0.7 },
];
const SERIES = [
  { title: 'The Stormlight Archive', sub: '5 books · 212 h' },
  { title: 'Inkworld', sub: '3 books · 41 h' },
  { title: 'Quiet Places', sub: '4 books · 58 h' },
];
const LIBRARY = {
  'tracks:artists': { round: true, items: PEOPLE.map(p => person(p, 'Artist')) },
  'tracks:albums': { items: ALBUMS },
  'tracks:songs': { items: TRACKS.map(t => ({ title: t.title, sub: t.meta })) },
  'albums:authors': { round: true, items: ['Alex Michaelides', 'Brandon Sanderson', 'Evelyn Harper', 'Cornelia Funke'].map(p => person(p, 'Author')) },
  'albums:books': { items: BOOKS },
  'albums:series': { items: SERIES },
  'albums:narrators': { round: true, items: ['Louise Brealey', 'Ray Porter', 'Michael Kramer', 'Adam Rivers'].map(p => person(p, 'Narrator')) },
};
const SUBTABS = {
  tracks: [
    { key: 'artists', label: 'Artists', icon: 'artist' },
    { key: 'albums', label: 'Albums', icon: 'album' },
    { key: 'songs', label: 'Songs', icon: 'music_note' },
  ],
  albums: [
    { key: 'authors', label: 'Authors', icon: 'history_edu' },
    { key: 'books', label: 'Books', icon: 'menu_book' },
    { key: 'series', label: 'Series', icon: 'auto_stories' },
    { key: 'narrators', label: 'Narrators', icon: 'record_voice_over' },
  ],
};

const TITLE = { color: 'var(--surface-fg)', fontFamily: 'var(--font-heading)', fontWeight: 'var(--weight-super-strong)', fontSize: 'var(--h2-size)', marginBottom: 20 };
const EYEBROW = { color: 'var(--surface-fg-muted)', fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', fontWeight: 'var(--weight-strong)', textTransform: 'uppercase', letterSpacing: 0.5, padding: '8px' };

const FILTERS = ['All', 'Music', 'Audiobooks', 'Podcasts'];
const KIND = { Music: 'Album', Audiobooks: 'Book', Podcasts: 'Podcast' };
const keep = (list, f) => f === 'All' ? list : list.filter(x => (x.sub || '').startsWith(KIND[f] || f));

const SECTIONS = {
  'Recently added': { items: SHELF },
  'Picked for you': { items: ALBUMS },
  'Artists & authors': { items: PEOPLE.map(p => person(p, 'Artist')), round: true },
};

function Home({ open, openAll, filter }) {
  const shelf = keep(SHELF, filter), picks = keep(PICKS, filter);
  return (
    <div style={{ padding: '36px var(--grid-margin) var(--grid-margin)' }}>
      <Section title="Jump back in" platform="desktop">
        <LayoutGrid item="wide" gap="calc(var(--grid-gutter) / 2)" maxWidth="var(--grid-max-width-tiles)">
          {picks.map(p => <QuickPick key={p.title} platform="desktop" title={p.title} sub={p.sub} image={cover(p.title, 120)} onClick={(e) => open(p.title, e)} />)}
        </LayoutGrid>
      </Section>
      <Section title="Recently added" platform="desktop" action="arrow_forward" onAction={(e) => openAll('Recently added', e)}>
        <Shelf>
          {shelf.map(s => <MediaCard key={s.title} title={s.title} sub={s.sub} progress={s.progress} absent={s.absent} image={cover(s.title)} onClick={(e) => open(s.title, e)} onPlay={() => {}} onPlayNext={() => {}} onPlayLast={() => {}} />)}
        </Shelf>
      </Section>
      <Section title="Picked for you" platform="desktop" action="arrow_forward" onAction={(e) => openAll('Picked for you', e)}>
        <Shelf>
          {ALBUMS.map(s => <MediaCard key={s.title} size="sm" title={s.title} sub={s.sub} progress={s.progress} absent={s.absent} image={cover(s.title)} onClick={(e) => open(s.title, e)} onPlay={() => {}} onPlayNext={() => {}} onPlayLast={() => {}} />)}
        </Shelf>
      </Section>
      <Section title="Artists & authors" platform="desktop" action="arrow_forward" onAction={(e) => openAll('Artists & authors', e)} last>
        <Shelf>
          {PEOPLE.map(p => <ArtistCard key={p} title={p} sub="Artist" image={cover(p, 320)} onClick={(e) => open(p, e)} />)}
        </Shelf>
      </Section>
    </div>
  );
}

// One tabbed library section, in either view. Grid vs list is the only difference between the
// seven sub-pages — the data decides whether the cards are square or circular.
function Items({ items = [], round = false, mode = 'grid', open }) {
  return (
    <React.Fragment>
      {mode === 'grid' ? (
        <LayoutGrid maxWidth="var(--grid-max-width)">
          {items.map(i => round
            ? <ArtistCard key={i.title} title={i.title} sub={i.sub} width="100%" image={cover(i.title, 320)} onClick={(e) => open(i.title, e)} />
            : <MediaCard key={i.title} title={i.title} sub={i.sub} progress={i.progress} absent={i.absent} width="100%" image={cover(i.title)} onClick={(e) => open(i.title, e)} onPlay={() => {}} onPlayNext={() => {}} onPlayLast={() => {}} />)}
        </LayoutGrid>
      ) : (
        <div style={{ maxWidth: 'var(--grid-max-width-list)' }}>
          {items.map((i, n) => <ResultRow key={i.title} title={i.title} meta={i.sub} image={cover(i.title, 120)} divider={n < items.length - 1} onClick={(e) => open(i.title, e)} />)}
        </div>
      )}
    </React.Fragment>
  );
}

function Library({ items, round, mode = 'grid', onMode, open }) {
  return (
    <div style={{ padding: 'var(--grid-margin)' }}>
      <div style={{ display: 'flex', justifyContent: 'flex-end', marginBottom: 'var(--spacing-md)', maxWidth: 'var(--grid-max-width)' }}>
        <ViewToggle value={mode} onChange={onMode} />
      </div>
      <Items items={items} round={round} mode={mode} open={open} />
    </div>
  );
}

function Search() {
  return (
    <div style={{ padding: 'var(--grid-margin)' }}>
      <div style={{ maxWidth: 'var(--grid-max-width-list)' }}>
        <div style={EYEBROW}>Results</div>
        {RESULTS.map((r, i) => <ResultRow key={r.title} {...r} image={cover(r.title, 120)} divider={i < RESULTS.length - 1} />)}
      </div>
    </div>
  );
}

function Grid({ title, items, open }) {
  return (
    <div style={{ padding: 'var(--grid-margin)' }}>
      <LayoutGrid maxWidth="var(--grid-max-width)">
        {items.map(i => <MediaCard key={i.title} title={i.title} sub={i.sub} progress={i.progress} absent={i.absent} image={cover(i.title)} width="100%" onClick={(e) => open(i.title, e)} onPlay={() => {}} onPlayNext={() => {}} onPlayLast={() => {}} />)}
      </LayoutGrid>
    </div>
  );
}

function Settings() {
  const [flags, setFlags] = React.useState({ auto: true, wifi: true, gapless: false, explicit: true });
  const set = k => v => setFlags(f => ({ ...f, [k]: v }));
  return (
    <div style={{ padding: 'var(--grid-margin)', maxWidth: 'var(--grid-max-width-form)' }}>
      <div style={{ display: 'flex', flexDirection: 'column', gap: 20 }}>
        <FieldRow label="Library folder" value="/Volumes/Media/Sonora" />
        <div style={{ display: 'flex', flexDirection: 'column', gap: 10 }}>
          <SettingRow title="Auto-download requests" sub="Fetch approved requests as soon as a source appears." checked={flags.auto} onChange={set('auto')} />
          <SettingRow title="Wi-Fi only" sub="Pause transfers on metered connections." checked={flags.wifi} onChange={set('wifi')} />
          <SettingRow title="Gapless playback" sub="Crossfade album tracks with no silence between them." checked={flags.gapless} onChange={set('gapless')} />
          <SettingRow title="Show explicit content" sub="Include explicit titles in search and shelves." checked={flags.explicit} onChange={set('explicit')} />
        </div>
      </div>
    </div>
  );
}

function Detail({ title, play, origin }) {
  return (
    <DetailPage origin={origin} kindLabel="Album" title={title} subtitle="Various Artists" image={cover(title, 640)} onSubtitle={() => {}}
      meta={`2023 · ${TRACKS.length} tracks · 19 min`} onPlay={play} onPlayNext={play} onPlayLast={play}>
      {TRACKS.map((t, i) => <ResultRow key={t.title} title={t.title} meta={t.meta} status={t.status} tone={t.tone} actionGlyph={t.actionGlyph} image={cover(t.title, 120)} divider={i < TRACKS.length - 1} onClick={play} />)}
    </DetailPage>
  );
}

/* What the player panel shows behind its three tabs. */
const LYRICS = [
  'Weathergirl, reading rain off the glass',
  'Every forecast ends the same',
  'Static in the studio, midnight on the dial',
  'You call the storm by its first name',
  'Morning comes in grey and takes the signal down',
  'And the song plays on without a sound',
];
const QUEUE = [
  { id: 'np', title: TRACKS[0].title, sub: 'weathergirl · FLAVOR FOLEY', time: '4:18', current: true },
].concat(TRACKS.slice(1, 6).map((t, i) => ({ id: 'q' + i, title: t.title, sub: t.meta.split(' · ')[0], time: '3:52' })));

/* Rail footer: theme switch + library identity, pinned below the nav items. */
function RailFooter({ theme, setTheme, expanded }) {
  return (
    <React.Fragment>
      <div style={{ padding: '0 var(--spacing-md) var(--spacing-md)', display: 'flex', gap: 'var(--spacing-xs)', flexDirection: expanded ? 'row' : 'column' }}>
        {['light', 'dark'].map(t => (
          <button key={t} onClick={() => setTheme(t)} aria-label={t === 'light' ? 'Light theme' : 'Dark theme'} style={{
            flex: 1, display: 'inline-flex', alignItems: 'center', justifyContent: 'center', gap: 6, padding: '7px 0', cursor: 'pointer',
            fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', fontWeight: 'var(--weight-strong)',
            borderRadius: 'var(--radius-sm)', border: '1px solid var(--surface-border)',
            background: theme === t ? 'var(--accent)' : 'transparent',
            color: theme === t ? 'var(--accent-contrast)' : 'var(--surface-fg-muted)',
            transition: 'background 0.15s ease, color 0.15s ease',
          }}>
            <span style={{ fontFamily: 'Material Symbols Rounded', fontSize: 16 }}>{t === 'light' ? 'light_mode' : 'dark_mode'}</span>
            {expanded && (t === 'light' ? 'Light' : 'Dark')}
          </button>
        ))}
      </div>
      <div style={{ padding: 'var(--spacing-md)', borderTop: '1px solid var(--surface-border)', display: 'flex', alignItems: 'center', gap: 'var(--spacing-sm)', justifyContent: expanded ? 'flex-start' : 'center' }}>
        <div style={{ width: 26, height: 26, borderRadius: '50%', background: 'var(--accent)', flexShrink: 0 }} />
        {expanded && (
          <div style={{ flex: 1, minWidth: 0 }}>
            <div style={{ color: 'var(--surface-fg)', fontFamily: 'var(--font-body)', fontSize: 'var(--text-sm)', fontWeight: 'var(--weight-strong)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Local Library</div>
            <div style={{ color: 'var(--surface-fg-muted)', fontFamily: 'var(--font-body)', fontSize: 'var(--text-xs)', whiteSpace: 'nowrap', overflow: 'hidden', textOverflow: 'ellipsis' }}>Music · Books · Podcasts</div>
          </div>
        )}
      </div>
    </React.Fragment>
  );
}

function App() {
  const [view, setView] = React.useState('home');
  const [playing, setPlaying] = React.useState(true);
  const [progress, setProgress] = React.useState(0.04);
  const [panelOpen, setPanelOpen] = React.useState(true);
  const [panel, setPanel] = React.useState('now');
  const [sync, setSync] = React.useState('sync');
  const [queue, setQueue] = React.useState(QUEUE);
  // Tapping the bar's own tab button closes the panel; any other tab switches to it.
  const showPanel = (tab) => { if (panelOpen && panel === tab) { setPanelOpen(false); return; } setPanel(tab); setPanelOpen(true); };
  const [theme, setTheme] = React.useState('dark');
  const [expanded, setExpanded] = React.useState(true);
  const [filter, setFilter] = React.useState('All');
  React.useEffect(() => {
    if (!playing) return;
    const id = setInterval(() => setProgress(p => (p >= 1 ? 0 : p + 0.002)), 200);
    return () => clearInterval(id);
  }, [playing]);
  // Each view declares its own chrome; LibraryShell owns how they behave (detail memory, sub-tabs,
  // list/grid mode, scroll memory, the search morph).
  const VIEWS = [
    { key: 'search', title: 'Search', searchScope: 'library', searchPlaceholder: 'What do you want to listen to?', searchOpen: true },
    { key: 'home', title: 'Browse', controls: ButtonGroup ? <ButtonGroup items={FILTERS} value={filter} onChange={setFilter} /> : null },
    { key: 'tracks', title: 'Music', searchScope: 'Music', subtabs: SUBTABS.tracks, defaultSubtab: 'songs' },
    { key: 'albums', title: 'Audiobooks', searchScope: 'Audiobooks', subtabs: SUBTABS.albums, defaultSubtab: 'books' },
    { key: 'artists', title: 'Podcasts', searchScope: 'Podcasts' },
    { key: 'settings', title: 'Settings' },
  ];
  return (
    <LibraryShell views={VIEWS} view={view} theme={theme} contentMinWidth="var(--content-min-width)" searchHeight="40px"
      rail={<NavRail items={NAV} active={view} onChange={setView}
        expanded={expanded} onToggleExpanded={() => setExpanded(!expanded)}
        footer={<RailFooter theme={theme} setTheme={setTheme} expanded={expanded} />} />}
      sheet={<NowPlaying platform="desktop" open={panelOpen} tab={panel} onTabChange={setPanel} onClose={() => setPanelOpen(false)}
        track={{ title: 'weathergirl', artist: 'weathergirl · FLAVOR FOLEY', context: 'Playing from FLAVOR FOLEY', image: cover('weathergirl', 640) }}
        player={{ playing, progress, duration: 258, onTogglePlay: () => setPlaying(!playing), onSeek: setProgress, speed: '1.0x', sleep: 'Off', onSpeed: () => {}, onSleep: () => {} }}
        lyrics={{ lines: LYRICS, activeIndex: Math.min(LYRICS.length - 1, Math.floor(progress * LYRICS.length)), syncMode: sync, onSyncModeChange: setSync }}
        queue={{ items: queue,
          onPlay: () => setPlaying(true),
          onReorder: (f, t) => setQueue((l) => { const n = l.slice(); n.splice(t, 0, n.splice(f, 1)[0]); return n; }),
          onRemove: (it) => setQueue((l) => l.filter((x) => x !== it)),
          onRemoveSelected: (keys) => setQueue((l) => l.filter((x) => keys.indexOf(x.id) < 0)) }} />}
      sheetOpen={panelOpen}
      player={<MiniPlayer platform="desktop" title="weathergirl" artist="weathergirl · FLAVOR FOLEY" image={cover('weathergirl', 160)}
        playing={playing} onTogglePlay={() => setPlaying(!playing)}
        progress={progress} onSeek={setProgress} duration={258}
        onOpen={() => showPanel('now')}
        queueOpen={panelOpen && panel === 'queue'} onToggleQueue={() => showPanel('queue')}
        lyricsOpen={panelOpen && panel === 'lyrics'} onToggleLyrics={() => showPanel('lyrics')} />}>
      {({ view: v, viewKey, detail, collection, origin, openDetail, openCollection, mode, setMode }) => (
        detail
          ? <Detail key={detail} title={detail} origin={origin} play={() => setPlaying(true)} />
          : collection && SECTIONS[collection]
          ? <CollectionPage key={collection} origin={origin} mode={mode} onMode={setMode}>
              <Items {...SECTIONS[collection]} mode={mode} open={openDetail} />
            </CollectionPage>
          : <React.Fragment>
              {v === 'search' && <Search />}
              {v === 'home' && <Home open={openDetail} openAll={openCollection} filter={filter} />}
              {LIBRARY[viewKey] && <Library {...LIBRARY[viewKey]} mode={mode} onMode={setMode} open={openDetail} />}
              {v === 'artists' && <Grid title="Podcasts" open={openDetail} items={[
                { title: 'Deep Inertia Radio', sub: 'Podcast · 212 episodes' },
                { title: 'Sonic Tales', sub: 'Podcast · 148 episodes', progress: 0.3 },
                { title: 'Fleeting Verses', sub: 'Podcast · 64 episodes' },
                { title: 'Soul Vertex Live', sub: 'Podcast · 31 episodes', absent: true },
              ]} />}
              {v === 'settings' && <Settings />}
            </React.Fragment>
      )}
    </LibraryShell>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body></html>
