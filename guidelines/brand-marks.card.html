<!-- @dsCard group="Brand" viewport="700x220" name="Wordmark" subtitle="Display face at --weight-super-strong on the width axis — accent mark at the same optical height" -->
<link rel="stylesheet" href="../styles.css">
<div style="background:var(--surface-bg);padding:32px;display:flex;flex-direction:column;gap:28px;font-family:var(--font-body)">
<div style="display:flex;align-items:center;gap:12px">
<div style="width:34px;height:34px;border-radius:8px;background:var(--accent)"></div>
<span style="color:var(--surface-fg);font-family:var(--font-display);font-weight:var(--weight-super-strong);font-stretch:var(--display-stretch);font-size:34px;letter-spacing:-0.01em">Sonora</span>
</div>
<div data-theme="light" style="display:flex;align-items:center;gap:12px;background:var(--surface-bg);padding:16px;border-radius:var(--radius-md)">
<div style="width:34px;height:34px;border-radius:8px;background:var(--accent)"></div>
<span style="color:var(--surface-fg);font-family:var(--font-display);font-weight:var(--weight-super-strong);font-stretch:var(--display-stretch);font-size:34px;letter-spacing:-0.01em">Sonora</span>
</div>
</div>
