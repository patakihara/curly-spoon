<!-- @dsCard group="Colors" viewport="700x150" name="State Colors" subtitle="Error / success / warning / info — one step each, shared by both themes" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:130px;font-family:var(--font-body);background:var(--surface-bg)">
<div style="flex:1;background:var(--state-error);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px">error</div>
<div style="flex:1;background:var(--state-success);display:flex;align-items:flex-end;padding:10px;color:#000;font-size:12px">success</div>
<div style="flex:1;background:var(--state-warning);display:flex;align-items:flex-end;padding:10px;color:#000;font-size:12px">warning</div>
<div style="flex:1;background:var(--state-info);display:flex;align-items:flex-end;padding:10px;color:#fff;font-size:12px">info</div>
</div>
