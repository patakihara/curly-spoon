<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:absolute;left:0;right:0;bottom:0;top:{{ np.sheetTop }};background:{{ sheetVis.fill }};border-radius:{{ sheetVis.cornerTop }}px {{ sheetVis.cornerTop }}px 0 0;overflow:{{ sheetVis.overflow }};display:flex;flex-direction:column;transition:{{ mx.layer.nowPlaying.surface }};box-shadow:{{ sheetVis.shadow }}">
  <div style="position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:{{ sheetVis.handleGap }}px;padding-top:{{ sheetVis.handleTop }}px"><dc-import name="ListItem" dc-props="{{ np.handleIx }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import><div style="width:{{ sheetVis.handleWidth }}px;height:{{ sheetVis.handleHeight }}px;border-radius:{{ sheetVis.handleRadius }}px;background:{{ sheetVis.handle }}"></div>
    <div style="position:relative;z-index:1;align-self:stretch;padding:0 {{ sheetVis.tabInset }}px"><dc-import name="TabBar" tabs="{{ np.tabs }}" selected="{{ np.tabSel }}" motion="{{ np.tabMo }}" visuals="{{ np.tabVis }}" hint-size="100%,48px"></dc-import></div>
  </div>
  <div style="flex:1;min-height:0;overflow:auto;padding:{{ sheetVis.contentPadY }}px 0">
    <sc-if value="{{ np.empty }}" hint-placeholder-val="{{ false }}"><dc-import name="EmptyState" text="{{ np.emptyText }}" icon="" visuals="{{ np.emptyVis }}" hint-size="100%,100px"></dc-import></sc-if>
    <sc-for list="{{ np.rows }}" as="qr" hint-placeholder-count="4"><div style="background:{{ qr.bg }}"><dc-import name="ListRow" dc-props="{{ qr.ix }}" item-id="{{ qr.id }}" text="{{ qr.label }}" sub="{{ qr.sub }}" art="{{ qr.art }}" trailing="{{ qr.trailing }}" thumb="40" pad-y="4" divider="none" hint-size="100%,48px"></dc-import></div></sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:640},&quot;np&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;unknown&quot;},&quot;sheetVis&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;unknown&quot;},&quot;mx&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;unknown&quot;}}">
// Web implementation of the player page's inner sheet (design component bottomSheet; Up next / Lyrics / Related):
// surface, corners, shadow, drag handle, tabs and the queue rows (queueRow variant). The shell places it and feeds it values.
class Component extends DCLogic {}
</script>
</body>
</html>
