AutoName: Auralis
Summary: Audiobook, podcast and music client for your own media server
Description: |
  Auralis is a Material 3 Expressive client for a self-hosted media server: audiobooks and
  podcasts from Audiobookshelf, and music from Jellyfin, in one app with one search.

  Play audiobooks and podcasts with chapter-aware seeking and cross-device progress sync,
  browse and play your Jellyfin music library with synced lyrics, and request new
  audiobooks or albums to be added to your library — all from a single home screen.

  Auralis is a client only: it does not host or bundle any media, and it does not work
  without a media server (Audiobookshelf, and optionally Jellyfin) already running
  somewhere reachable from your device. See the project's `docs/SELF_HOSTING.md` for the
  server side.

