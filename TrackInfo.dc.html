<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;align-items:{{ align }};gap:{{ v.gap }}px;text-align:{{ v.align }};min-width:0"><div style="font-size:{{ v.titleSize }}px;font-weight:{{ v.titleWeight }};max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ title }}</div><div style="font-family:{{ v.subFont }};font-size:{{ v.subSize }}px;color:{{ v.subColor }};max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis">{{ subtitle }}</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:80},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Track title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;subtitle&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Artist&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component trackInfo (size md | lg). Props: title, subtitle, visuals (resolved with the size variant). No values of its own.
class Component extends DCLogic {
  renderVals() { const v = this.props.visuals || {}; return { v, title: this.props.title || '', subtitle: this.props.subtitle || '', align: v.align === 'center' ? 'center' : 'flex-start' }; }
}
</script>
</body>
</html>
