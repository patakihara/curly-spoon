<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;flex-direction:column;gap:{{ gap }}px"><sc-for list="{{ rows }}" as="r" hint-placeholder-count="4"><dc-import name="CheckRow" ix="{{ r.ix }}" text="{{ r.text }}" visuals="{{ r.vis }}" symbol-visuals="{{ symbolVisuals }}" hint-size="100%,44px"></dc-import></sc-for></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:320,&quot;height&quot;:200},&quot;rows&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ ix: object; text: string; vis: Record&lt;string, unknown&gt; }[]&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component checklist: one CheckRow per option, top to bottom. Props: rows [{ ix, text, vis }] (each option's
// interaction and its checkRow visuals, resolved with its selected status, from the shell), symbolVisuals, visuals (resolved: gap).
class Component extends DCLogic {
  renderVals() {
    const v = this.props.visuals || {};
    return { rows: this.props.rows || [], symbolVisuals: this.props.symbolVisuals || {}, gap: +v.gap || 0 };
  }
}
</script>
</body>
</html>
