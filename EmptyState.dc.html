<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="padding:{{ py }}px {{ px }}px;display:flex;flex-direction:column;align-items:center;gap:{{ gap }}px;text-align:center;color:{{ ink }}">
  <sc-if value="{{ hasIcon }}" hint-placeholder-val="{{ true }}"><dc-import name="Symbol" icon="{{ icon }}" visuals="{{ iconVis }}" hint-size="36px,36px"></dc-import></sc-if>
  <div style="font-size:{{ fs }}px">{{ text }}</div>
  <sc-if value="{{ hasRetry }}" hint-placeholder-val="{{ false }}"><dc-import name="Button" dc-props="{{ retryIx }}" text="{{ retry }}" hint-size="80px,36px"></dc-import></sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:200},&quot;text&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Nothing here yet&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;icon&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;inbox&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;retry&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;retryIx&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design components emptyState and errorState (variant: icon + retry). Props: text, icon (resolved by the shell from the
// component's visuals: icon / offlineIcon), retry (label; shown with retryIx), retryIx (Button props), visuals (resolved). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const v = this.props.visuals || {};
    const icon = this.props.icon ?? v.icon ?? '';
    return { text: this.props.text || '', icon, hasIcon: !!icon, hasRetry: !!this.props.retry, retry: this.props.retry || '', retryIx: this.props.retryIx || {},
      ink: v.ink || 'inherit', iconVis: { ...(this.props.symbolVisuals || {}), size: +v.iconSize || 36, color: v.iconColor, padEnd: 0 }, fs: +v.fontSize || 14, py: +v.padY || 0, px: +v.padX || 0, gap: +v.gap || 0 };
  }
}
</script>
</body>
</html>
