<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;display:flex;border-bottom:1px solid {{ divider }}">
  <sc-for list="{{ tabs }}" as="t" hint-placeholder-count="3"><div style="flex:1;min-width:0;display:flex"><dc-import name="Tab" dc-props="{{ t.ix }}" text="{{ t.label }}" style="width:100%;height:{{ h }}px" hint-size="100%,48px"></dc-import></div></sc-for>
  <div style="position:absolute;bottom:-1px;height:{{ ih }}px;background:{{ ic }};inset-inline-start:{{ left }}%;width:{{ w }}%;transition:{{ tr }};pointer-events:none"></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:60},&quot;tabs&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ ix: object; label: string }[]&quot;},&quot;selected&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:0,&quot;tsType&quot;:&quot;number&quot;},&quot;motion&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ ms: number; ease: string }&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of design component tabBar, drawn from its node (platforms/web/draw.js). Props: options [{ value, label,
// selected }] (the node's), optionProps (each option drawn as its option component, tab: interaction), motions.indicator (design),
// visuals (resolved: height, divider, indicator, indicatorHeight). The indicator sits under the selected option. No values of its own.
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.visuals || {}, opts = p.options || [], ox = p.optionProps || [], n = Math.max(1, opts.length), m = (p.motions || {}).indicator || {};
    const tabs = opts.map((o, i) => ({ label: o.label, ix: ox[i] || {} })), sel = Math.max(0, opts.findIndex(o => o.selected));
    return { tabs, h: +v.height || 48, divider: v.divider || 'transparent', ic: v.indicator || 'currentColor', ih: +v.indicatorHeight || 2,
      left: 100 * sel / n, w: 100 / n, tr: m.kind !== 'instant' && m.ms ? 'left ' + m.ms + 'ms ' + (m.easing || 'ease') : 'none' };
  }
}
</script>
</body>
</html>
