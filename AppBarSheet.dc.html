<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-sheet="1" style="position:relative;width:100%;height:{{ h }}px;box-sizing:border-box;display:flex;flex-direction:column;padding-top:{{ v.sheetPadTop }}px;background:{{ v.sheetFill }};border-radius:{{ v.sheetRadius }}px {{ v.sheetRadius }}px 0px 0px;box-shadow:{{ v.sheetShadow }};overflow:hidden">
  <div style="flex:1;min-height:0;position:relative;overflow:hidden">
    <sc-if value="{{ info.show }}" hint-placeholder-val="{{ true }}"><div style="position:absolute;inset:0"><dc-import name="DetailHeader" title="{{ info.title }}" subtitle="{{ info.sub }}" image="{{ info.img }}" visuals="{{ info.vis }}" style="width:100%;height:100%" hint-size="100%,100%"></dc-import></div></sc-if>
  </div>
  <div style="flex:none;height:{{ v.bottomRowHeight }}px;box-sizing:border-box;padding:0 {{ v.bottomRowPadX }}px;display:flex;align-items:center;gap:{{ v.bottomRowGap }}px">
    <div style="flex:1;min-width:0;display:flex"><dc-import name="Bar" height="{{ v.bottomRowHeight }}" row="{{ v.bottomRowHeight }}" start="{{ none }}" end="{{ find }}" title="" visuals="{{ rowVis }}" ease="{{ ease }}" style="width:100%" hint-size="100%,64px"></dc-import></div>
    <div ref="{{ btnRef }}" style="flex:none;display:flex;gap:{{ v.bottomRowGap }}px"><sc-for list="{{ buttons }}" as="bb" hint-placeholder-count="1"><dc-import name="Button" dc-props="{{ bb.ix }}" text="{{ bb.text }}" icon="{{ bb.icon }}" hint-size="88px,40px"></dc-import></sc-for></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:260},&quot;height&quot;:{&quot;editor&quot;:&quot;int&quot;,&quot;default&quot;:256,&quot;tsType&quot;:&quot;number&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;},&quot;info&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ show: boolean; title: string; sub: string; img: string; vis: object }&quot;},&quot;find&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;buttons&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ text: string; ix: object }[]&quot;},&quot;btnRef&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;ease&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;}}">
// Web implementation of the appBar page form's lower part (design component appBar, 14.2): the sheet with the album info
// (expanded slot, a detailHeader whose art shrinks with the sheet) and the bottom slot row (search field + buttons).
// Props: height (from barView), visuals (appBar), info { show, title, sub, img, vis }, find (Bar start items: the field), buttons [{ text, ix }],
// btnRef (the shell measures the buttons to size the field), ease. No values of its own.
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.visuals || {};
    return { v, h: +p.height || 0, info: p.info || { show: false }, find: p.find || [], none: [], buttons: p.buttons || [], btnRef: p.btnRef || null, ease: p.ease || 'ease',
      rowVis: { ...v, fill: 'transparent', ink: 'inherit', padding: '0', divider: 'transparent' } };
  }
}
</script>
</body>
</html>
