<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div data-occluder="1" style="position:relative;height:{{ h }}px;flex:none;box-sizing:border-box;display:flex;align-items:{{ v.align }};padding:{{ v.padding }};background:{{ v.fill }};color:{{ v.ink }};border-bottom:1px solid {{ divider }};box-shadow:{{ shadow }};transition:{{ tr }};overflow:hidden">
  <sc-if value="{{ hasSurface }}" hint-placeholder-val="{{ false }}"><dc-import name="ListItem" dc-props="{{ surfaceIx }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></sc-if>
  <div style="height:{{ row }}px;display:flex;align-items:center"><sc-for list="{{ start }}" as="hi" hint-placeholder-count="1"><div data-fixed="{{ hi.key }}" style="position:{{ hi.pos }};inset-inline-start:{{ hi.absX }};top:{{ hi.absY }};z-index:1;flex:none;display:flex;align-items:center;overflow:hidden;max-width:{{ hi.maxW }}px;opacity:{{ hi.op }};pointer-events:{{ hi.ev }};transition:max-width {{ hi.dur }}ms {{ ease }}, opacity {{ hi.dur }}ms">
    <sc-if value="{{ hi.is.IconButton }}" hint-placeholder-val="{{ true }}"><dc-import name="IconButton" dc-props="{{ hi.props }}" hint-size="48px,48px"></dc-import></sc-if>
    <sc-if value="{{ hi.is.Symbol }}" hint-placeholder-val="{{ false }}"><dc-import name="Symbol" dc-props="{{ hi.props }}" hint-size="30px,24px"></dc-import></sc-if>
    <sc-if value="{{ hi.is.Label }}" hint-placeholder-val="{{ false }}"><dc-import name="Label" dc-props="{{ hi.props }}" hint-size="72px,16px"></dc-import></sc-if>
    <sc-if value="{{ hi.is.Morph }}" hint-placeholder-val="{{ false }}"><dc-import name="Morph" dc-props="{{ hi.props }}" hint-size="48px,40px"></dc-import></sc-if>
  </div></sc-for></div>
  <div data-fixed="{{ titleKey }}" style="position:relative;flex:1;min-width:0;align-self:stretch;max-height:{{ row }}px;display:flex;align-items:center;max-width:{{ titleMaxW }};padding-inline-start:{{ titlePad }}px;opacity:{{ titleOp }};transition:{{ titleTr }}"><sc-if value="{{ hasTitleIx }}" hint-placeholder-val="{{ false }}"><dc-import name="ListItem" dc-props="{{ titleIx }}" style="position:absolute;inset:0" hint-size="100%,100%"></dc-import></sc-if><div style="flex:1;min-width:0"><dc-import name="Title" text="{{ title }}" height="{{ row }}" visuals="{{ titleVis }}" hint-size="100%,24px"></dc-import></div></div>
  <div style="height:{{ row }}px;display:flex;align-items:center"><sc-for list="{{ end }}" as="hi" hint-placeholder-count="1"><div data-fixed="{{ hi.key }}" style="position:{{ hi.pos }};inset-inline-start:{{ hi.absX }};top:{{ hi.absY }};z-index:1;flex:none;display:flex;align-items:center;overflow:hidden;max-width:{{ hi.maxW }}px;opacity:{{ hi.op }};pointer-events:{{ hi.ev }};transition:max-width {{ hi.dur }}ms {{ ease }}, opacity {{ hi.dur }}ms">
    <sc-if value="{{ hi.is.IconButton }}" hint-placeholder-val="{{ true }}"><dc-import name="IconButton" dc-props="{{ hi.props }}" hint-size="48px,48px"></dc-import></sc-if>
    <sc-if value="{{ hi.is.Symbol }}" hint-placeholder-val="{{ false }}"><dc-import name="Symbol" dc-props="{{ hi.props }}" hint-size="30px,24px"></dc-import></sc-if>
    <sc-if value="{{ hi.is.Label }}" hint-placeholder-val="{{ false }}"><dc-import name="Label" dc-props="{{ hi.props }}" hint-size="72px,16px"></dc-import></sc-if>
    <sc-if value="{{ hi.is.Morph }}" hint-placeholder-val="{{ false }}"><dc-import name="Morph" dc-props="{{ hi.props }}" hint-size="48px,40px"></dc-import></sc-if>
  </div></sc-for></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:360,&quot;height&quot;:64},&quot;start&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;end&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object[]&quot;},&quot;title&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Title&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;titleVis&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;},&quot;titleOp&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;titleMaxW&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;titlePad&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;titleIx&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;surfaceIx&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;object&quot;},&quot;height&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;row&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;},&quot;divider&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;shadow&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;ease&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;motion&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;{ ms?: number; titleMs?: number }&quot;},&quot;visuals&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;Record&lt;string, unknown&gt;&quot;}}">
// Web implementation of the bar roles — design components header (back layer), frontHeader and appBar (form page | layer): start items, title, end items.
// Props: start / end (slot items: nodes drawn by platforms/web/draw.js — { dc, is, props } — plus the shell's arrangement: pos, absX, absY, maxW, op, ev, dur);
// each item is drawn by its node's DC (IconButton · Symbol · Label · Morph), fed the node's props.
// title, titleVis, titleOp, titleMaxW, titlePad, titleIx (optional interactive title), surfaceIx (optional interactive surface), height / row (px; default visuals.height),
// Each start / end item and the title carry data-fixed (slot + content): the detail transition keeps parts found in both headers.
// divider / shadow (state-driven overrides), ease, motion ({ ms } of the bar's own changes), visuals (resolved bar visuals). No values of its own.
class Component extends DCLogic {
  renderVals() {
    const p = this.props, v = p.visuals || {}, h = +(p.height ?? v.height) || 56, m = p.motion || {};
    const fix = (a, slot) => (a || []).map(x => ({ pos: 'relative', absX: 'auto', absY: 'auto', maxW: 48, op: 1, ev: 'auto', dur: 0, is: {}, props: {}, ...x, key: slot + ':' + String((x.props || {}).icon || (x.props || {}).text || (x.props || {}).component || '') }));
    return { v, h, row: +(p.row ?? v.row ?? h) || h, start: fix(p.start, 'start'), end: fix(p.end, 'end'), ease: p.ease || 'ease',
      title: p.title || '', titleKey: 'title:' + (p.title || ''), titleVis: p.titleVis || {}, titleOp: p.titleOp ?? 1, titleMaxW: p.titleMaxW || '100%', titlePad: +(p.titlePad ?? 0), titleTr: m.titleMs ? 'opacity ' + m.titleMs + 'ms' : 'none',
      hasTitleIx: !!p.titleIx, titleIx: p.titleIx || {}, hasSurface: !!p.surfaceIx, surfaceIx: p.surfaceIx || {},
      divider: p.divider || v.divider || 'transparent', shadow: p.shadow || v.shadow || 'none', tr: m.ms ? 'border-color ' + m.ms + 'ms, box-shadow ' + m.ms + 'ms, height ' + m.ms + 'ms ' + (p.ease || 'ease') : 'none' };
  }
}
</script>
</body>
</html>
