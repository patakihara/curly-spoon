<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div onClick="{{ onClick }}" style="position:absolute;inset:0;background:{{ color }};opacity:{{ op }};pointer-events:{{ ev }};transition:{{ tr }};cursor:{{ cur }}"></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:200,&quot;height&quot;:120},&quot;color&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;string&quot;},&quot;shown&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onClick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;() =&gt; void&quot;},&quot;ms&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;number&quot;}}">
// Web drawing of a surface's scrim (colour from the surface's design visuals: frontLayer / sideSheet / drawer `scrim`). Props: color, shown, onClick, ms. No values of its own.
class Component extends DCLogic {
  renderVals() { const p = this.props, on = !!p.shown; return { color: p.color || 'transparent', op: on ? 1 : 0, ev: on ? 'auto' : 'none', onClick: p.onClick || (() => {}), tr: p.ms ? 'opacity ' + p.ms + 'ms' : 'none', cur: p.onClick ? 'pointer' : 'default' }; }
}
</script>
</body>
</html>
