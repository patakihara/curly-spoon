<li>The shelf explains itself: an eyebrow naming the relationship, the subject in bold, and the subject&#x27;s own artwork as a thumbnail.</li>
<li>The thumbnail is circular for a person and square for a show or genre — shape encodes the subject&#x27;s type.</li>
<li>The header is pressable: it leads to the subject that produced the recommendation.</li>
</ul>

<script type="text/babel">
const NS = window.SonoraDesignSystem_6c1435 || {};
const { MediaCard, Section, SectionHeader } = window.SonoraDesignSystem_6c1435 || {};
const DOC = document.getElementById('__doc').innerHTML;
const EXAMPLES = [
  { name: 'SectionHeader', role: 'ext', uses: ['SectionHeader'], node: () => (
<SectionHeader
  eyebrow="Popular with listeners of"
  title="Rosa Elin"
  image={'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="hsl(210 52% 38%)"/><circle cx="40" cy="34" r="13" fill="hsl(210 68% 76%)"/><circle cx="40" cy="72" r="24" fill="hsl(210 68% 76%)"/></svg>')}
  round
  onSubject={() => {}}
  actionText="Show all"
  onAction={() => {}}
/>
  ) },
  { name: 'Section', role: 'ext', uses: ['MediaCard', 'Section'], node: () => (
<Section
  eyebrow="More like"
  title="Static & Signal"
  image={'data:image/svg+xml;utf8,' + encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80"><rect width="80" height="80" fill="hsl(265 55% 40%)"/><rect x="14" y="30" width="52" height="20" rx="10" fill="hsl(265 72% 76%)"/></svg>')}
  onSubject={() => {}}
  actionText="Show all"
  onAction={() => {}}
  last
>
  <div style={{display:'flex',gap:'var(--spacing-lg)'}}>
    <MediaCard size="sm" width="96px" title="The Glass Archivist" onClick={() => {}} />
    <MediaCard size="sm" width="96px" title="Aftershocks: the second call" onClick={() => {}} />
    <MediaCard size="sm" width="96px" title="Episode 44 — After the tape ran out" onClick={() => {}} />
  </div>
</Section>
  ) },
  { name: 'MediaCard', role: 'ext', uses: ['MediaCard'], node: () => (
<MediaCard
  size="sm"
  width="120px"
  eyebrow="Podcast"
  title="Aftershocks: the second call"
  sub="Static & Signal"
  unplayed
  savedBadge
  markers={["push_pin", "download_done"]}
  onClick={() => {}}
/>
  ) },
];
function Page() {
  return <React.Fragment>
    <div dangerouslySetInnerHTML={{ __html: DOC }} />
    {EXAMPLES.length > 0 && (
      <section className="ex">
        <h2 className="exh">Live examples</h2>
        <div className="exgrid">
          {EXAMPLES.map((e) => {
            // A name the bundle does not export destructures to `undefined`, and rendering
            // <undefined/> throws "Element type is invalid" — which unmounts the WHOLE card,
            // write-up included, and leaves a black pane nobody notices until they open it.
            // So check first and draw a labelled placeholder instead. `node` is a thunk for
            // this reason: an eagerly-built element would already have logged the error.
            const miss = e.uses.filter((n) => !NS[n]);
            return (
              <div key={e.name}>
                <div className={'exlabel ' + e.role}><code>{e.name}</code></div>
                <div className="exbox">
                  {miss.length
                    ? <div className="exmiss">
                        <b>Component not loaded</b>
                        <code>{miss.join(', ')}</code>
                      </div>
                    : e.node()}
                </div>
              </div>
            );
          })}
        </div>
      </section>
    )}
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
