<link rel="stylesheet" href="../styles.css">
<div style="display:flex;height:130px;font-family:var(--font-body);background:var(--surface-bg)">
<div style="flex:1;background:var(--accent);display:flex;align-items:flex-end;padding:10px;color:var(--accent-contrast);font-size:13px;font-weight:var(--weight-strong)">accent<br/>Violet #8B5CF6</div>
<div style="flex:1;background:var(--surface-bg);display:flex;align-items:flex-end;padding:10px;color:var(--accent-ink);font-size:12px;font-weight:var(--weight-strong)">accent-ink<br/>#A78BFA</div>
<div style="flex:1;background:var(--play);display:flex;align-items:flex-end;padding:10px;color:var(--play-contrast);font-size:13px;font-weight:var(--weight-strong)">play<br/>Rose #F44862</div>
<div style="flex:1;background:var(--surface-now-playing);display:flex;align-items:flex-end;padding:10px;color:var(--play-ink);font-size:12px;font-weight:var(--weight-strong)">play-ink<br/>#FF7A8D</div>
</div>
