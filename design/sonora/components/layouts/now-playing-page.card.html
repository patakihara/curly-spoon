<!-- @dsCard group="Layouts" viewport="1760x1600" name="Now Playing" subtitle="The player with Now playing, Queue and Lyrics as tabs: a full-screen sheet on mobile, a side panel beside the transport bar on desktop, music and spoken" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg-alt);font-family:var(--font-body)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { NowPlaying, MiniPlayer, AboutCard } = window.SonoraDesignSystem_6c1435;
const LINES = ['Tidal lines on the shore','Static coast forevermore','Horizon caught the static hush','Radio waves in gentle rush','Counting seconds in the wire','Every signal that we hire'];
const QUEUE = [
  { id: 1, title: 'Tidal Lines', sub: 'The Nebula Collective', time: '3:34', current: true },
  { id: 2, title: 'Aftershocks: the second call', sub: 'Static & Signal', time: '52:10', handoff: 'Then the spoken queue' },
  { id: 5, title: 'Aftershocks: the third call', sub: 'Static & Signal', time: '48:40' },
  { id: 3, title: 'Static Coast', sub: 'The Nebula Collective', time: '3:18', waiting: 'Waiting in the music queue' },
  { id: 4, title: 'Empty Rooms', sub: 'Echo Fields', time: '5:01' },
];
const MUSIC = { title: 'Tidal Lines', artist: 'The Nebula Collective', context: 'Playing from Driftwave' };
const SPOKEN = { title: 'Aftershocks: the second call', artist: 'Static & Signal', context: 'Playing from Static & Signal' };

function useDemo() {
  const [playing, setPlaying] = React.useState(true);
  const [progress, setProgress] = React.useState(0.42);
  const [sync, setSync] = React.useState('dot');
  const [items, setItems] = React.useState(QUEUE);
  const [queue, setQueue] = React.useState('music');
  return {
    player: { playing, progress, duration: 214, onTogglePlay: () => setPlaying(!playing), onSeek: setProgress, onFavourite: () => {}, speed: 1.5, sleep: 'Off' },
    lyrics: { lines: LINES, activeIndex: 2, syncMode: sync, onSyncModeChange: setSync },
    queue: {
      items, queues: [{ key: 'music', label: 'Music' }, { key: 'spoken', label: 'Spoken' }], queue, onQueueChange: setQueue,
      context: 'Music queue · 3 songs', played: [{ id: 0, title: 'Hollow Fields', sub: 'Echo Fields', time: '4:12' }],
      autoplay: { title: 'From Driftwave radio', items: [{ id: 9, title: 'Signal Fires', sub: 'The Nebula Collective', time: '3:51' }] },
      onClear: () => {}, onReorder: (f, t) => setItems((l) => { const n = l.slice(); n.splice(t, 0, n.splice(f, 1)[0]); return n; }),
      onRemove: (it) => setItems((l) => l.filter((x) => x !== it)), onRemoveSelected: (keys) => setItems((l) => l.filter((x) => keys.indexOf(x.id) < 0)),
    },
  };
}

/* Mobile: the sheet covers the frame, the bottom bar included, with the three tabs under its app bar. */
function Phone({ tab: first = 'now', variant = 'music' }) {
  const d = useDemo();
  const [tab, setTab] = React.useState(first);
  const track = variant === 'spoken' ? SPOKEN : MUSIC;
  return <div style={{ position: 'relative', width: 360, height: 740, overflow: 'hidden', borderRadius: 32, background: 'var(--surface-bg)', boxShadow: 'var(--shadow-xl)', flexShrink: 0 }}>
    <NowPlaying platform="mobile" open variant={variant} tab={tab} onTabChange={setTab} onClose={() => {}} track={track} {...d}
      player={Object.assign({}, d.player, variant === 'spoken' ? { sleep: '23 min' } : {})} onMore={() => {}} />
  </div>;
}

/* Desktop: the side panel beside the content column, over the full-width bar that carries the transport. */
function Desk({ variant = 'music' }) {
  const d = useDemo();
  const [tab, setTab] = React.useState('now');
  const track = variant === 'spoken' ? SPOKEN : MUSIC;
  return <div style={{ width: 900, height: 740, display: 'flex', flexDirection: 'column', overflow: 'hidden', borderRadius: 14, background: 'var(--surface-bg-alt)', color: 'var(--surface-fg)', boxShadow: 'var(--shadow-xl)', flexShrink: 0 }}>
    <div style={{ flex: 1, minHeight: 0, display: 'flex' }}>
      <div style={{ flex: 1, minWidth: 0, padding: 28, color: 'var(--surface-fg-muted)', fontSize: 'var(--text-sm)' }}>Content column</div>
      <NowPlaying platform="desktop" open variant={variant} tab={tab} onTabChange={setTab} onClose={() => {}} track={track} {...d} onMore={() => {}} />
    </div>
    <MiniPlayer platform="desktop" variant={variant} title={track.title} artist={track.artist} playing progress={0.42} duration={214} speed={1.5} sleep="Off" onTogglePlay={() => {}} onOpen={() => {}} onSeek={() => {}} onPrev={() => {}} onNext={() => {}} onShuffle={() => {}} onRepeat={() => {}} onVolume={() => {}} onToggleQueue={() => {}} onToggleLyrics={() => {}} onSkipBack={() => {}} onSkipForward={() => {}} onSpeed={() => {}} onSleep={() => {}} />
  </div>;
}

function Themed() {
  return <div style={{ display: 'flex', flexDirection: 'column' }}>
    <div data-theme="dark" style={{ background: 'var(--surface-bg-alt)', padding: 24, display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}>
      <Phone /><Phone variant="spoken" /><Desk />
    </div>
    <div data-theme="light" style={{ background: 'var(--surface-bg-alt)', padding: 24, display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}>
      <Phone tab="queue" /><Phone tab="lyrics" /><Desk variant="spoken" />
    </div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Themed/>);
</script></body></html>
