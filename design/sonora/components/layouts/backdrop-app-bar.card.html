<!-- @dsCard group="Layouts" viewport="1400x900" name="Backdrop — App Bar" subtitle="A page that is not a destination: a top app bar on the page surface on a phone, no backdrop, its heading in SectionHeader's context form when the page is named by its subject; a page with nothing beside it in one centred column" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg)}</style>
<div id="root"></div>
<script type="text/babel">
const { BackdropShell, BackLayer, NavRail, Section, LayoutGrid, MediaCard, ResultRow, IconButton, BottomNav, ViewToggle, PageBody, EmptyState, Button } = window.SonoraDesignSystem_6c1435;

const art = (hue) => 'data:image/svg+xml;utf8,' + encodeURIComponent(
  '<svg xmlns="http://www.w3.org/2000/svg" width="80" height="80">' +
  '<rect width="80" height="80" fill="hsl(' + hue + ' 55% 42%)"/>' +
  '<circle cx="40" cy="40" r="18" fill="hsl(' + hue + ' 70% 72%)"/></svg>');
const NAV = [{key:'browse',label:'Browse',icon:'explore'},{key:'music',label:'Music',icon:'album'},{key:'books',label:'Books',icon:'book_2'},{key:'podcasts',label:'Podcasts',icon:'podcasts'},{key:'search',label:'Search',icon:'search'}];
const ALBUMS = [
  {title:'Driftwave', sub:'Halcyon Bloom', hue:265},
  {title:'Static & Signal', sub:'Echo Fields', hue:200},
  {title:'Low Orbit', sub:'Echo Fields', hue:320},
  {title:'Lantern Season', sub:'Rosa Elin', hue:30},
  {title:'Field Notes', sub:'Halcyon Bloom', hue:150},
  {title:'Nightglass', sub:'Echo Fields', hue:230},
];
const TRACKS = ['Tidal Lines','Salt Water','Low Tide','Harbour Lights','Undertow'];

const Tag = ({children}) => <span style={{flexShrink:0,padding:'3px 10px',borderRadius:'var(--radius-pill)',border:'1px solid var(--surface-border)',fontFamily:'var(--font-body)',fontSize:'var(--text-xs)',fontWeight:'var(--weight-strong)',color:'var(--surface-fg-muted)',whiteSpace:'nowrap'}}>{children}</span>;
const Caption = ({children}) => <div style={{fontFamily:'var(--font-body)',fontSize:'var(--text-xs)',fontWeight:'var(--weight-strong)',color:'var(--surface-fg-muted)',minHeight:30,lineHeight:1.35}}>{children}</div>;
const close = () => <IconButton icon="close" label="Close" />;

function Grid({platform}){
  return <div style={{padding:'var(--spacing-lg) var(--grid-margin' + (platform === 'mobile' ? '-mobile' : '') + ')'}}>
    <Section platform={platform} last>
      <LayoutGrid platform={platform}>
        {ALBUMS.map((a) => <MediaCard key={a.title} platform={platform} width="100%" title={a.title} sub={'Album · ' + a.sub} image={art(a.hue)} />)}
      </LayoutGrid>
    </Section>
  </div>;
}

function Tracks(){
  return <div style={{padding:'var(--spacing-md) var(--grid-margin-mobile)'}}>
    {TRACKS.map((t, i) => <ResultRow key={t} platform="mobile" title={t} meta="Halcyon Bloom · 3:41" divider />)}
  </div>;
}

const Alone = ({platform}) => <EmptyState platform={platform} icon="group" title="Sign in with your household account"
  body="One account for every server you run." action={<Button variant="primary" platform={platform}>Sign in</Button>} />;

/* A phone's detail page: the heading is a top app bar on --surface-bg, the front layer flat under
   it, nothing of the backdrop behind. The bottom bar stays. */
function Phone({caption, back, children}){
  return <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-sm)',minWidth:0}}>
    <Caption>{caption}</Caption>
    <div style={{height:420,display:'flex',flexDirection:'column',borderRadius:'var(--radius-md)',overflow:'hidden',border:'1px solid var(--surface-border)'}}>
      <BackdropShell platform="mobile" appBar back={back}
        player={<BottomNav platform="mobile" items={NAV} active="browse" />}>
        {children}
      </BackdropShell>
    </div>
  </div>;
}

function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-lg)'}}>
    <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:'var(--spacing-lg)'}}>
      <Phone caption="Phone · an album: close and its title, in the body face"
        back={<BackLayer platform="mobile" leading={close()} title="Driftwave" search="Search this album" />}>
        <Tracks />
      </Phone>
      <Phone caption="Phone · a shelf: close, the subject's art, the eyebrow over its title; no header below says it again"
        back={<BackLayer platform="mobile" leading={close()} eyebrow="More like" title="Halcyon Bloom" image={art(265)} round
          trailing={<ViewToggle value="grid" />} />}>
        <Grid platform="mobile" />
      </Phone>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-sm)'}}>
      <Caption>Desktop · the same shelf stays in the backdrop of the destination that opened it, that rail item lit; its heading takes the same context form in the display face</Caption>
      <div style={{height:300}}>
        <BackdropShell platform="desktop"
          rail={<NavRail items={NAV} active="browse" expanded={false} />}
          back={<BackLayer leading={close()} eyebrow="More like" title="Halcyon Bloom" image={art(265)} round search="Search this shelf"
            trailing={<ViewToggle value="grid" />} />}>
          <Grid platform="desktop" />
        </BackdropShell>
      </div>
    </div>
    <div style={{display:'flex',flexWrap:'wrap',gap:'var(--spacing-lg)',alignItems:'flex-start'}}>
      <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-sm)',width:300}}>
        <Caption>Phone · a page with nothing beside it, signing in: no close, no bar below, the title at the page margin</Caption>
        <div style={{height:380,display:'flex',flexDirection:'column',borderRadius:'var(--radius-md)',overflow:'hidden',border:'1px solid var(--surface-border)'}}>
          <BackdropShell platform="mobile" appBar column="form" back={<BackLayer platform="mobile" title="Sign in" />}>
            <PageBody platform="mobile" width="form"><Alone platform="mobile" /></PageBody>
          </BackdropShell>
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-sm)',width:620}}>
        <Caption>Desktop, at half size · the same page, no rail: its heading and content in one centred column, the heading starting where the content does</Caption>
        <div style={{zoom:0.5,width:1240,height:420,borderRadius:'var(--radius-lg)',overflow:'hidden',border:'2px solid var(--surface-border)'}}>
          <BackdropShell platform="desktop" column="form" back={<BackLayer title="Sign in" />}>
            <PageBody width="form"><Alone platform="desktop" /></PageBody>
          </BackdropShell>
        </div>
      </div>
    </div>
    <div style={{display:'flex',flexWrap:'wrap',gap:'var(--spacing-sm)'}}>
      <Tag>column · centred, heading at the page margin</Tag>
      <Tag>appBar · --surface-bg, front layer flat</Tag>
      <Tag>Hairline · fades in as the content scrolls</Tag>
      <Tag>Context form · 40px art, --text-xs eyebrow</Tag>
    </div>
  </div>;
}

function Themed(){
  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>
    <div data-theme="dark" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
    <div data-theme="light" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Themed/>);
</script>
