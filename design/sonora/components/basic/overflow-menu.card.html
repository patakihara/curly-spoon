<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg)}</style>

<script type="text/babel">
const { OverflowMenu, ResultRow } = window.SonoraDesignSystem_6c1435;

const VERBS = [
  { key: 'add', label: 'Add to library', icon: 'library_add', sub: 'Keeps a copy of your own' },
  { key: 'artist', label: 'Go to artist', icon: 'person' },
  { key: 'share', label: 'Share', icon: 'share' },

function Caption({ children }) {
  return <div style={{fontSize:'var(--text-sm)',color:'var(--surface-fg-muted)',marginBottom:'var(--spacing-md)',maxWidth:640}}>{children}</div>;
}

function Desktop(){
  return <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-xl)'}}>
    <div>
      <Caption>Shut, at a row's trailing edge: the verbs a row offers beyond playing it.</Caption>
      <ResultRow platform="desktop" title="Tidal Lines" meta="Harbour Lights · 3:41" trailing={<OverflowMenu platform="desktop" items={VERBS} onSelect={() => {}} />} onClick={() => {}} />

    <div style={{display:'flex',justifyContent:'flex-end',paddingBottom:200}}>
      <div>

        <div style={{display:'flex',justifyContent:'flex-end'}}><OverflowMenu platform="desktop" items={VERBS} onSelect={() => {}} open /></div>
      </div>
    </div>
  </div>;
}
/* The sheet is fixed to the window; the frame's transform makes it the window here, as a phone's
   screen would be, so the sheet covers the frame's rows and bar rather than the whole card. */
function Phone(){
  return <div>
    <Caption>Open on a phone: a modal bottom sheet over a scrim, covering the bottom bar and mini-player too.</Caption>
    <div style={{position:'relative',transform:'translateZ(0)',overflow:'hidden',width:360,height:440,borderRadius:'var(--radius-md)',border:'1px solid var(--surface-border)',background:'var(--surface-bg)'}}>

          <ResultRow key={t} platform="mobile" title={t} meta="Harbour Lights · 3:41" divider

    </div>
  </div>;
}

  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>
