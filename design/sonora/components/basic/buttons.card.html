<!-- @dsCard group="Basic" viewport="1200x340" name="Buttons & Icon Buttons" subtitle="Primary / secondary / ghost / danger, leading icons, circular icon-only controls, desktop + mobile radii" -->
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg)}</style>
<div id="root"></div>
<script type="text/babel">
const { Button, IconButton } = window.SonoraDesignSystem_6c1435;
const glyph = (name, size) => <span style={{fontFamily:'Material Symbols Rounded',fontSize:size||'var(--icon-sm)'}}>{name}</span>;
function Demo(){
  return <div style={{display:'flex',flexDirection:'column',gap:14}}>
    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <Button variant="primary" icon={glyph('play_arrow')}>Play</Button>
      <Button variant="secondary" icon={glyph('shuffle')}>Shuffle</Button>
      <Button variant="ghost">Settings</Button>
      <Button variant="danger">Delete</Button>
      <Button variant="primary" disabled>Disabled</Button>
    </div>
    <div style={{display:'flex',gap:10,flexWrap:'wrap'}}>
      <Button variant="primary" size="sm">Small</Button>
      <Button variant="primary" size="md">Medium</Button>
      <Button variant="primary" size="lg">Large</Button>
    </div>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>
      <IconButton label="Previous"><span style={{fontFamily:'Material Symbols Rounded',fontSize:'var(--icon-sm)'}}>skip_previous</span></IconButton>
      <IconButton label="Play" size={56}><span style={{fontFamily:'Material Symbols Rounded',fontSize:'var(--icon-md)',color:'var(--accent)'}}>play_arrow</span></IconButton>
      <IconButton label="Next"><span style={{fontFamily:'Material Symbols Rounded',fontSize:'var(--icon-sm)'}}>skip_next</span></IconButton>
      <IconButton label="Shuffle" muted><span style={{fontFamily:'Material Symbols Rounded',fontSize:'var(--icon-sm)'}}>shuffle</span></IconButton>
      <IconButton label="More" muted><span style={{fontFamily:'Material Symbols Rounded',fontSize:'var(--icon-sm)'}}>more_vert</span></IconButton>
      <IconButton label="Close" icon="close" />
      <IconButton label="Queue" icon="queue_music" active />
    </div>
    <div style={{display:'flex',gap:10,flexWrap:'wrap',background:'var(--surface-card)',padding:12,borderRadius:12}}>
      <Button variant="primary" platform="mobile" icon={glyph('play_arrow')}>Play all</Button>
      <Button variant="secondary" platform="mobile">Shuffle play</Button>
    </div>
  </div>;
}
function Themed(){
  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>
    <div data-theme="dark" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
    <div data-theme="light" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Themed/>);
</script>
