<script type="text/babel">

function Caption({ children }) {

}

        <BrowseCard title="Audiobooks" onClick={() => {}} />
        <BrowseCard title="True crime" onClick={() => {}} />
        <BrowseCard title="Cooking & baking" onClick={() => {}} />
        <BrowseCard title="Sleep & calm" onClick={() => {}} />
        <BrowseCard title="Kids' shows" onClick={() => {}} />
        <BrowseCard title="Live recordings" onClick={() => {}} />
      </div>
    </div>
    <div>
      <Caption>StatusBanner's four tones — a persistent, non-dismissing statement of system state, unlike a toast. One carries a text action, one is dismissible.</Caption>
      <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-sm)',maxWidth:640}}>
        <StatusBanner tone="info" icon="schedule">Library last synced 2 hours ago.</StatusBanner>
        <StatusBanner tone="warning" icon="storage" actionLabel="Manage storage" onAction={() => {}}>Downloads paused — device storage is nearly full.</StatusBanner>

    </div>
    <div>
      <Caption>BackToTop, shown visible — a floating escape from a feed that has no bottom.</Caption>
      <BackToTop visible={true} onClick={() => {}} />
    </div>
  </div>;

function Themed(){
  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>
