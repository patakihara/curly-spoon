<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg)}</style>
<div id="root"></div>
<script type="text/babel">
const { EditableList, QueueRow } = window.SonoraDesignSystem_6c1435;
const QUEUE = [
  {id:1,title:'Tidal Lines',sub:'The Nebula Collective',time:'3:34',current:true},
  {id:2,title:'Static Coast',sub:'The Nebula Collective',time:'3:18'},
  {id:3,title:'Empty Rooms',sub:'Echo Fields',time:'5:01'},
  {id:4,title:'Signal Fires',sub:'The Nebula Collective',time:'3:51'},
];
function Demo(){
  return <div style={{maxWidth:480}}>
    <EditableList items={QUEUE} editing actionLabel="Remove" hint="Select songs to remove" renderRow={({ item, key, selected, editing, toggle, drag }) => <QueueRow key={key} title={item.title} sub={item.sub} time={item.time} editing={editing} selected={selected} onSelectToggle={toggle} {...drag}/>}/>
  </div>;
}
function Themed(){
  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>
    <div data-theme="dark" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
    <div data-theme="light" style={{flex:'1 1 380px',minWidth:0,background:'var(--surface-bg)',color:'var(--surface-fg)',fontFamily:'var(--font-body)',padding:20}}><Demo/></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Themed/>);
</script>
