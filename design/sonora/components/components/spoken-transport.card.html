}

      <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-lg)',alignItems:'flex-start'}}>
        <TransportBar variant="music" playing onTogglePlay={() => {}} onPrev={() => {}} onNext={() => {}} onShuffle={() => {}} onRepeat={() => {}} onSkipBack={() => {}} onSkipForward={() => {}} />
        <TransportBar
          variant="spoken"
          playing
          onTogglePlay={() => {}}
          onSkipBack={() => {}}
          onSkipForward={() => {}}
          skipSeconds={15}
          leading={<SpeedControl value={1.5} onClick={() => {}} />}
          trailing={<IconButton label="Sleep timer" icon="bedtime" onClick={() => {}} />} onShuffle={() => {}} onPrev={() => {}} onNext={() => {}} onRepeat={() => {}}
        />
      </div>
    </div>
    <div>
      <Caption>The desktop player bar, the one place desktop draws the transport, in the same two variants: music keeps shuffle / previous / next / repeat and the lyrics button; spoken has speed, skip back and forward and the sleep timer, and no lyrics. Media controls never go to the next or previous item on spoken content, except at an episode or chapter boundary.</Caption>
      <div style={{display:'flex',flexDirection:'column',gap:'var(--spacing-md)'}}>
        <MiniPlayer platform="desktop" title="Tidal Lines" artist="The Nebula Collective" playing progress={0.42} duration={214} onTogglePlay={() => {}} onOpen={() => {}} onSeek={() => {}} onPrev={() => {}} onNext={() => {}} onShuffle={() => {}} onRepeat={() => {}} onVolume={() => {}} onToggleQueue={() => {}} onToggleLyrics={() => {}} onSkipBack={() => {}} onSkipForward={() => {}} onSpeed={() => {}} onSleep={() => {}} />

    </div>
    <div>
      <Caption>SpeedControl at rest (1×, muted ink) beside a rate-shifted 1.5× — the colour change is the whole point, so leaving it at 1.5x stays visible instead of quietly getting forgotten.</Caption>
      <div style={{display:'flex',gap:'var(--spacing-lg)',alignItems:'center'}}>
        <SpeedControl value={1} onClick={() => {}} />
