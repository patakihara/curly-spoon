<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">

<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

<div id="root"></div>
<script type="text/babel">
const { MiniPlayer, ResultRow, MediaHeader, Button } = window.SonoraDesignSystem_6c1435;
function Demo(){
  const [playing,setPlaying]=React.useState(true);
  return <div style={{display:'flex',flexDirection:'column',gap:24}}>
    <div style={{maxWidth:412}}>
      <MiniPlayer title="Heartbeats in Silence" artist="Deep Inertia" playing={playing} onTogglePlay={()=>setPlaying(!playing)} />

    <MiniPlayer platform="desktop" title="weathergirl" artist="weathergirl · FLAVOR FOLEY"
      playing={playing} onTogglePlay={()=>setPlaying(!playing)} progress={0.42} duration={258} />
    <div style={{maxWidth:620}}>
      <ResultRow title="Wind and Truth" meta="Brandon Sanderson · Audiobook · 62 h" status="In library" tone="library" />

      <ResultRow title="Shadows and Sighs" meta="Evelyn Harper · Album · 11 tracks" status="Queued" tone="progress" />
      <ResultRow title="Fleeting Verses Live" meta="Fleeting Verses · Podcast · 2 h 04 m" status="Searching…" tone="progress" />

    <div style={{color:'var(--surface-fg-muted)',fontSize:'var(--text-xs)',fontWeight:'var(--weight-strong)',textTransform:'uppercase',letterSpacing:.5}}>Result rows on a phone — a status with a percentage keeps only the percentage beside a trailing control</div>
    <div style={{maxWidth:380}}>
      <ResultRow platform="mobile" title="Salt and Stone" meta="Book · Maya Lind · AudiobookBay" status="Downloading · 42%" tone="progress" trailing={<Button variant="secondary" size="sm" platform="mobile" pressed>Requested</Button>} />

      meta="2023 · 18 chapters · 14 h 42 m" onPlay={()=>{}} onPlayNext={()=>{}} onPlayLast={()=>{}} />

  return <div style={{display:'flex',flexWrap:'wrap',alignItems:'flex-start'}}>

}
