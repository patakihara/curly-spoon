<!-- @dsCard group="Components" viewport="1400x900" name="Now Playing" subtitle="The canonical player: mobile sheet with lyrics/queue previews and bottom app bar, desktop side panel with tabs" -->
<!DOCTYPE html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style id="__card-page-css">html,body{margin:0;background:var(--surface-bg-alt);font-family:var(--font-body)}</style>
</head><body>
<div id="root"></div>
<script type="text/babel">
const { NowPlaying, NowPlayingPage, LyricsPage, QueuePage, MiniPlayer, BottomAppBar } = window.SonoraDesignSystem_6c1435;
const LINES = ['Tidal lines on the shore','Static coast forevermore','Horizon caught the static hush','Radio waves in gentle rush','Counting seconds in the wire','Every signal that we hire'];
const QUEUE = [
  { id: 1, title: 'Tidal Lines', sub: 'The Nebula Collective', time: '3:34', current: true },
  { id: 2, title: 'Static Coast', sub: 'The Nebula Collective', time: '3:18' },
  { id: 3, title: 'Empty Rooms', sub: 'Echo Fields', time: '5:01' },
  { id: 4, title: 'Hollow Fields', sub: 'Echo Fields', time: '4:12' },
];
const TRACK = { title: 'Tidal Lines', artist: 'The Nebula Collective', context: 'Playing from Driftwave' };

function useDemo() {
  const [playing, setPlaying] = React.useState(true);
  const [progress, setProgress] = React.useState(0.42);
  const [sync, setSync] = React.useState('sync');
  const [items, setItems] = React.useState(QUEUE);
  return {
    player: { playing, progress, duration: 214, onTogglePlay: () => setPlaying(!playing), onSeek: setProgress, onFavourite: () => {}, speed: '1.0x', sleep: 'Off' },
    lyrics: { lines: LINES, activeIndex: 2, syncMode: sync, onSyncModeChange: setSync },
    queue: { items, onReorder: (f, t) => setItems((l) => { const n = l.slice(); n.splice(t, 0, n.splice(f, 1)[0]); return n; }), onRemove: (it) => setItems((l) => l.filter((x) => x !== it)), onRemoveSelected: (keys) => setItems((l) => l.filter((x) => keys.indexOf(x.id) < 0)) },
  };
}

/* Mobile: the sheet covers the frame and expands from the bar it came from. */
function Phone() {
  const d = useDemo();
  const [open, setOpen] = React.useState(true);
  const [from, setFrom] = React.useState(null);
  const barRef = React.useRef(null);
  const openFromBar = () => { const el = barRef.current; setFrom(el ? el.getBoundingClientRect() : null); setOpen(true); };
  return <div style={{ position: 'relative', width: 390, height: 780, overflow: 'hidden', borderRadius: 32, background: 'var(--surface-bg)', color: 'var(--surface-fg)', display: 'flex', flexDirection: 'column', boxShadow: 'var(--shadow-xl)', flexShrink: 0 }}>
    <div style={{ flex: 1, minHeight: 0, padding: 20, color: 'var(--surface-fg-muted)', fontSize: 'var(--text-sm)' }}>Library beneath</div>
    <div ref={barRef} onClick={openFromBar} style={{ flexShrink: 0, cursor: 'pointer' }}>
      <MiniPlayer platform="mobile" title={TRACK.title} artist={TRACK.artist} playing={d.player.playing} onTogglePlay={d.player.onTogglePlay} />
    </div>
    <NowPlaying platform="mobile" open={open} from={from} onClose={() => setOpen(false)} track={TRACK} {...d} />
  </div>;
}

/* Desktop: the same props, rendered as the side panel. */
function Desk() {
  const d = useDemo();
  const [tab, setTab] = React.useState('now');
  return <div style={{ width: 760, height: 780, display: 'flex', overflow: 'hidden', borderRadius: 14, background: 'var(--surface-bg)', color: 'var(--surface-fg)', boxShadow: 'var(--shadow-xl)', flexShrink: 0 }}>
    <div style={{ flex: 1, minWidth: 0, padding: 28, color: 'var(--surface-fg-muted)', fontSize: 'var(--text-sm)' }}>Content column</div>
    <NowPlaying platform="desktop" open tab={tab} onTabChange={setTab} onClose={() => {}} track={TRACK} {...d} />
  </div>;
}

/* The two full pages the mobile previews open into. */
function Pages() {
  const d = useDemo();
  const frame = (kids) => <div style={{ width: 340, height: 560, display: 'flex', flexDirection: 'column', overflow: 'hidden', borderRadius: 24, background: 'var(--surface-bg)', color: 'var(--surface-fg)', boxShadow: 'var(--shadow-lg)', flexShrink: 0 }}>{kids}</div>;
  const bar = <BottomAppBar spread={false} align="end" actions={[{ icon: 'lyrics', label: 'Lyrics', active: true }, { icon: 'queue_music', label: 'Queue' }, { icon: 'speaker', label: 'Output' }, { icon: 'more_vert', label: 'More' }]} />;
  return <div style={{ display: 'flex', gap: 24, flexWrap: 'wrap' }}>
    {frame(<LyricsPage platform="mobile" title={TRACK.title} artist={TRACK.artist} footer={bar} {...d.lyrics} />)}
    {frame(<QueuePage platform="mobile" context={TRACK.context} editing {...d.queue} />)}
  </div>;
}

function Themed() {
  return <div style={{ display: 'flex', flexDirection: 'column' }}>
    <div data-theme="dark" style={{ background: 'var(--surface-bg-alt)', padding: 24, display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}><Phone /><Desk /></div>
    <div data-theme="light" style={{ background: 'var(--surface-bg-alt)', padding: 24, display: 'flex', gap: 28, flexWrap: 'wrap', alignItems: 'flex-start' }}><Pages /></div>
  </div>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Themed/>);
</script></body></html>
