<style id="__card-page-css">

       border-radius:var(--radius-sm);background:var(--surface-bg-alt)}

<template id="__doc">
<div class="wrap">
<img class="shot" src="../assets/reference/spotify/S01.jpg" alt="Podcast show — episode list, scrolled">
<div class="col">
<h1>S01 — Podcast show — episode list, scrolled</h1>
<p class="src">Show detail page, Episodes tab, scrolled past the header.</p>
<h2>Affordances observed</h2><ul>
<li>Each episode carries a two-line synopsis, not just a title — you choose an episode by reading it.</li>
<li>A meta chain compresses four facts into one line: play count, publication date, duration, and a listened state.</li>
<li>&quot;Finished&quot; is a distinct terminal state, marked with a filled check, separate from part-played progress.</li>
<li>Per-episode verbs sit on the row itself — save, download, share, more — each showing its own state.</li>
<li>The filter/sort state is *stated* above the list (&quot;All episodes • Newest&quot;) and is itself the control that changes it.</li>
<li>A floating pill offers escape from a list with no bottom.</li>
</ul>
<h2>Components</h2>
<div class="row new"><span class="tag">Created</span><code>EpisodeRow</code> <code>DownloadButton</code> <code>SortFilterBar</code></div>
<div class="row ext"><span class="tag">Extended</span><code>Badge</code></div>
<div class="row "><span class="tag">Existing</span><code>TabBar</code> <code>CoverArt</code> <code>MiniPlayer</code> <code>BottomNav</code></div>
</div></div>
</template>
<div id="root"></div>
<script type="text/babel">
const NS = window.SonoraDesignSystem_6c1435 || {};
const { Badge, DownloadButton, EpisodeRow, SortFilterBar, ViewToggle } = window.SonoraDesignSystem_6c1435 || {};
const DOC = document.getElementById('__doc').innerHTML;
const EXAMPLES = [
  { name: 'EpisodeRow', role: 'new', uses: ['EpisodeRow'], node: () => (
<div style={{ width: 520, maxWidth: '100%' }}>
  <EpisodeRow
    title="Aftershocks: the second call"
    meta={['12K plays', '29 Dec 2025', '48min']}
    progress={0.38}
    description="A dispatcher who walked away from the job three years ago picks the phone back up, once."
    onPlay={() => {}}
    onClick={() => {}}
  />
</div>
  ) },
  { name: 'DownloadButton', role: 'new', uses: ['DownloadButton'], node: () => (
<DownloadButton state="downloading" progress={0.42} size={44} onClick={() => {}} />
  ) },
  { name: 'SortFilterBar', role: 'new', uses: ['SortFilterBar', 'ViewToggle'], node: () => (
<div style={{ width: 520, maxWidth: '100%' }}>
  <SortFilterBar
    label="All episodes • Newest"
    onClick={() => {}}
    trailing={<ViewToggle value="grid" onChange={() => {}} />}
  />
</div>
  ) },
  { name: 'Badge', role: 'ext', uses: ['Badge'], node: () => (
<div style={{display:'flex',gap:'var(--spacing-lg)',alignItems:'center'}}>
  <Badge size="md" tone="success" icon="verified" plain>Verified</Badge>
  <Badge size="md" tone="neutral" square>E</Badge>
</div>
  ) },
];
function Page() {
  return <React.Fragment>
    <div dangerouslySetInnerHTML={{ __html: DOC }} />
    {EXAMPLES.length > 0 && (
      <section className="ex">
        <h2 className="exh">Live examples</h2>
        <div className="exgrid">
          {EXAMPLES.map((e) => {
            // A name the bundle does not export destructures to `undefined`, and rendering
            // <undefined/> throws "Element type is invalid" — which unmounts the WHOLE card,
            // write-up included, and leaves a black pane nobody notices until they open it.
            // So check first and draw a labelled placeholder instead. `node` is a thunk for
            // this reason: an eagerly-built element would already have logged the error.
            const miss = e.uses.filter((n) => !NS[n]);
            return (
              <div key={e.name}>
                <div className={'exlabel ' + e.role}><code>{e.name}</code></div>
                <div className="exbox">
                  {miss.length
                    ? <div className="exmiss">
                        <b>Component not loaded</b>
                        <code>{miss.join(', ')}</code>
                      </div>
                    : e.node()}
                </div>
              </div>
            );
          })}
        </div>
      </section>
    )}
  </React.Fragment>;
}
ReactDOM.createRoot(document.getElementById('root')).render(<Page />);
</script>
